name: Reliability

# One job per tool, run one after another rather than in parallel.
#
# The scenarios need the machine to themselves. Two of them measure how long a
# tool takes to react — the gap between a block being published and its rows
# being readable, and how quickly an indexer picks up after its database comes
# back — and a neighbour competing for CPU on the same runner would show up as
# a tool that cannot keep up with the head. The throughput jobs have the same
# problem and solve it the same way.
#
# Nothing here needs an API token: the chain is generated by the benchmark and
# the tools are pointed at it. That also means this workflow runs on a fork.

on:
  workflow_dispatch:
    inputs:
      tools:
        description: 'Tools to measure (space-separated). Leave empty for all.'
        required: false
        default: ''
        type: string
      scenarios:
        description: 'Scenarios to run (comma-separated). Leave empty for all.'
        required: false
        default: ''
        type: string
      repeats:
        description: 'Runs per scenario. A check passes only if every run passed.'
        required: false
        default: '3'
        type: string
  schedule:
    # Weekly, well clear of the benchmark schedule: a full suite is several
    # hours of runner time and nothing about it changes between commits.
    - cron: '0 3 * * 1'

jobs:
  tools:
    name: ${{ matrix.tool }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      # One tool at a time, and a tool that fails is a result rather than a
      # reason to stop measuring the others.
      max-parallel: 1
      fail-fast: false
      matrix:
        # Kept in step with RELIABILITY_TOOLS in reliability/lib/tools.ts by
        # scripts/test-reliability.ts, which the Checks workflow runs.
        tool:
          - envio-rpc
          - envio-subgraph-rpc
          - ponder
          - rindexer
          - sqd-rpc
          - subgraph
          - subquery
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Run the reliability suite
        env:
          TOOL: ${{ matrix.tool }}
          SCENARIOS: ${{ inputs.scenarios }}
          REPEATS: ${{ inputs.repeats || '3' }}
          SELECTED: ${{ inputs.tools }}
        run: |
          # A dispatch that named tools narrows the matrix; a tool this job is
          # not for is skipped rather than failing the run.
          if [ -n "$SELECTED" ] && ! echo " $SELECTED " | grep -q " $TOOL "; then
            echo "$TOOL was not selected by this run."
            exit 0
          fi
          ARGS="$TOOL --repeats=$REPEATS"
          [ -n "$SCENARIOS" ] && ARGS="$ARGS --scenarios=$SCENARIOS"
          node reliability/run.ts $ARGS 2>&1 | tee reliability-output.txt

      - name: Upload the result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reliability-${{ matrix.tool }}
          path: reliability-output.txt
          retention-days: 30

  summary:
    name: Summary
    needs: tools
    # A tool whose job failed is a result in its own right: the table carries
    # its last published row forward and marks it stale, which is the same
    # contract the throughput tables have.
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download the results
        uses: actions/download-artifact@v4
        with:
          path: results
          pattern: reliability-*

      # Writes the table into README.md between its markers and prints it. The
      # scheduled run leaves the edit in the workspace rather than committing
      # it; publishing is a separate decision from measuring, and the
      # throughput tables are committed by their own step for the same reason.
      - name: Build the reliability table
        run: node scripts/build-reliability-table.ts | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the updated README
        uses: actions/upload-artifact@v4
        with:
          name: reliability-readme
          path: README.md
          retention-days: 30
