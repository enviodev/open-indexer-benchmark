name: Reliability

# What a tool does when things go wrong, published beside what it does when
# they do not.
#
# The suite is expensive - every scenario, three runs each - so it runs at two
# depths, and all of it runs in one job, many runs at a time. Nothing is shared
# between one run and another: each scenario generates its own chain and its
# own database, and the runner gives every run in flight its own ports,
# containers and copy of the tool's project (reliability/lib/parallel.ts). So a
# depth costs roughly its slowest few runs rather than the sum of every
# scenario across seven tools, on one runner instead of thirty-five, with one
# checkout and one install per tool rather than one per job.
#
# What that gives up is a machine per run. The head-latency measures time how
# long a tool takes to react, and a neighbour competing for CPU can make that
# slower; they are the median of the repeats and read as such. The checks are
# pass or fail, with minutes of patience, and do not notice.
#
# A pull request that touches the suite gets every scenario once per tool,
# which fills every column of the table and is enough to say what each tool
# does. It is posted back as a comment and changes nothing in the repository.
#
# The full suite runs weekly, and on demand, and that is what writes the table
# into the README. Nothing about these results changes between commits - they
# are a property of each tool, not of this repository - so measuring them on
# every push to main would be hours of runner time to learn the same thing
# again.
#
# The paths filter is what keeps this off pull requests that have nothing to do
# with it; the throughput benchmarks have their own workflow and their own
# scope filter.
#
# Nothing here needs an API token: the chain is generated by the benchmark and
# the tools are pointed at it, so this runs on a fork like anywhere else.

on:
  workflow_dispatch:
    inputs:
      tools:
        description: 'Tools to measure (space-separated). Leave empty for all.'
        required: false
        default: ''
        type: string
      scenarios:
        description: 'Scenarios to run (comma-separated). Leave empty for all.'
        required: false
        default: ''
        type: string
      repeats:
        description: 'Runs per scenario. A check passes only if every run passed.'
        required: false
        default: '3'
        type: string
      parallel:
        description: 'Runs in flight at once, each with its own ports and containers.'
        required: false
        default: '12'
        type: string
  pull_request:
    paths:
      - 'reliability/**'
      - 'cases/lib/drivers/**'
      - 'cases/lib/process.ts'
      - 'cases/lib/verify.ts'
      - 'cases/lib/checksum.ts'
      - 'scripts/build-reliability-table.ts'
      - '.github/workflows/reliability.yml'
  push:
    # Merging a change to the suite republishes the table. Without this the
    # README's table waits for the Monday run, which is a week of a benchmark
    # page saying it has measured nothing.
    branches: [main]
    paths:
      - 'reliability/**'
      - 'cases/lib/drivers/**'
      - 'cases/lib/process.ts'
      - 'cases/lib/verify.ts'
      - 'cases/lib/checksum.ts'
      - 'scripts/build-reliability-table.ts'
      - '.github/workflows/reliability.yml'
  schedule:
    # Weekly, well clear of the benchmark schedule: a full suite is hours of
    # runner time and nothing about it changes between commits.
    - cron: '0 3 * * 1'

# One run per branch. Pushing again while a run is going leaves the first one
# measuring code nobody will merge, and leaves two summary jobs racing to write
# the same section of the same comment. A run on `main` or the schedule is
# left alone to finish, because what it publishes is the repository's own
# claim rather than a preview of somebody's branch.
concurrency:
  group: reliability-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    name: Scope
    runs-on: ubuntu-latest
    outputs:
      scenarios: ${{ steps.pick.outputs.scenarios }}
      repeats: ${{ steps.pick.outputs.repeats }}
      depth: ${{ steps.pick.outputs.depth }}
    steps:
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          SCENARIOS: ${{ inputs.scenarios }}
          REPEATS: ${{ inputs.repeats }}
        run: |
          # A pull request gets every scenario, once each. One scenario was
          # cheaper and published a table of dashes, which reads as a benchmark
          # that measures nothing; the repeat is what a pull request can afford
          # to drop, because it is what turns a signal into a published score.
          if [ "$EVENT" = "pull_request" ]; then
            echo "scenarios=" >> "$GITHUB_OUTPUT"
            echo "repeats=1" >> "$GITHUB_OUTPUT"
            echo "depth=single" >> "$GITHUB_OUTPUT"
          else
            echo "scenarios=${SCENARIOS}" >> "$GITHUB_OUTPUT"
            echo "repeats=${REPEATS:-3}" >> "$GITHUB_OUTPUT"
            echo "depth=full" >> "$GITHUB_OUTPUT"
          fi

  run:
    name: Run the suite
    needs: scope
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # The pull request's single pass is done in about as long as its slowest
    # few runs; the full suite is three times the work on the same pool. Every
    # scenario has a 45-minute backstop of its own and every worker a 90-minute
    # one, so this only stops a pool that is stuck as a whole. The run step
    # stops first, so the upload below still has time, and what it uploads
    # says how far the job got: the runner prints a result for a tool after
    # every one of its scenarios, with the rest unmeasured.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Run the reliability suite
        env:
          SCENARIOS: ${{ needs.scope.outputs.scenarios }}
          REPEATS: ${{ needs.scope.outputs.repeats }}
          PARALLEL: ${{ inputs.parallel || '12' }}
          SELECTED: ${{ inputs.tools }}
        run: |
          # An array, expanded quoted: every value here is a string a dispatch
          # supplies, and an unquoted expansion would let a space or a `*` in
          # one of them add arguments of its own. Tools are the exception,
          # split on spaces on purpose - and no tool is named with anything
          # else, so the runner refuses whatever a split turns up.
          ARGS=("--repeats=$REPEATS" "--parallel=$PARALLEL")
          # No tools named is every tool, and no scenarios named is every
          # scenario - the case a pull request and the weekly run both take.
          # An `&&` list that comes out false is a failed command under
          # `set -e`, hence the `if`s.
          if [ -n "$SELECTED" ]; then
            read -ra TOOLS <<< "$SELECTED"
            ARGS=("${TOOLS[@]}" "${ARGS[@]}")
          fi
          if [ -n "$SCENARIOS" ]; then
            ARGS+=("--scenarios=$SCENARIOS")
          fi
          node reliability/run.ts "${ARGS[@]}" 2>&1 | tee reliability-output.txt
        timeout-minutes: 280

      - name: Upload the result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reliability-all
          path: reliability-output.txt
          retention-days: 30

      # Every run's own log, uninterleaved: the step log above has a dozen runs
      # talking at once, each line prefixed with the run it came from.
      - name: Upload each run's log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-reliability
          path: reliability-logs/
          retention-days: 30
          if-no-files-found: ignore

  summary:
    name: Summary
    needs: [scope, run]
    # A tool that reported nothing is a result in its own right: the table carries
    # its last published row forward and marks it stale, which is the same
    # contract the throughput tables have.
    #
    # Not `always()`: a run superseded by a newer push has its run job
    # cancelled, and an `always()` job still starts - inside it `cancelled()`
    # reads false, so the comment step's guard let a table of "not part of
    # this run" replace the last complete one. A cancelled run says nothing.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download the results
        uses: actions/download-artifact@v4
        with:
          path: results
          pattern: reliability-*

      # Always writes /tmp/reliability-table.md; only rewrites README.md when
      # told to, so a pull request publishes a comment and main publishes the
      # repository's own claim.
      - name: Build the reliability table
        env:
          UPDATE_README: ${{ github.event_name == 'pull_request' && '0' || '1' }}
        run: node scripts/build-reliability-table.ts | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Comment the results on the pull request
        if: github.event_name == 'pull_request' && !cancelled()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SECTION: reliability
          DEPTH: ${{ needs.scope.outputs.depth }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Kept in step with RELIABILITY_TOOLS in reliability/lib/tools.ts by
          # scripts/test-reliability.ts, which the Checks workflow runs.
          TOOLS: envio-rpc envio-subgraph-rpc ponder rindexer sqd-rpc subgraph subquery
        run: |
          TABLE=/tmp/reliability-table.md
          [ -f "$TABLE" ] || echo "_No reliability results collected._" > "$TABLE"

          # A tool that was asked and reported nothing has failed, and it
          # must not read as a tool nobody measures: its row shows the last
          # published value, and this says so.
          # Counting non-empty lines, not newlines: the file has no trailing
          # one, so `wc -l` reports a tool short and every run would claim a
          # job had failed.
          #
          # The fallback is on the assignment, not inside it: `grep -c` on an
          # empty file prints 0 AND exits 1, so `$(grep -c . f || echo 0)` is
          # two lines, and `[ "0\n0" -eq 0 ]` is an error rather than true.
          # That is how a run with no results published a table of dashes.
          REPORTED=$(grep -c . /tmp/reliability-reported.txt 2>/dev/null) || REPORTED=0
          MISSING=$(( $(echo $TOOLS | wc -w) - REPORTED ))

          # A run where nothing reported has nothing to say, and saying it
          # anyway overwrites the last run's results with a table of dashes -
          # which is what a cancelled run did to a complete one. The carry
          # forward cannot save it either: that reads the README, and on a pull
          # request the README is whatever `main` last published.
          if [ "$REPORTED" -eq 0 ]; then
            echo "No tool reported a result, so the comment is left as it is."
            exit 0
          fi

          {
            echo "## Reliability"
            echo
            if [ "$DEPTH" = "single" ]; then
              echo "Every scenario, once per tool. The published table is the median of"
              echo "three runs with a check passing only if it passed every one, so treat a"
              echo "single run as a signal rather than a score."
              echo
            fi
            if [ "$MISSING" -gt 0 ]; then
              echo "> ⚠️ $MISSING tool(s) reported no result at all. Those rows show the"
              echo "> last published value; [check the run's logs]($RUN_URL)."
              echo
            fi
            cat "$TABLE"
            # Two: the table file ends without a newline, so the first only
            # finishes its last line and the link would join the notes.
            echo
            echo
            echo "[Full output]($RUN_URL) is in the workflow run logs."
            echo "[What each check means](./reliability/README.md)."
          } > /tmp/reliability-comment.md

          node scripts/pr-comment.ts /tmp/reliability-comment.md

      - name: Update README
        if: github.event_name != 'pull_request'
        run: |
          # Same as the comment above: a run that measured nothing must not
          # publish that as the repository's claim. The table builder carries
          # rows forward from the README, so a partial run is fine; a run with
          # no results at all is not a run.
          REPORTED=$(grep -c . /tmp/reliability-reported.txt 2>/dev/null) || REPORTED=0
          if [ "$REPORTED" -eq 0 ]; then
            echo "No tool reported a result, so the README is left as it is."
            exit 0
          fi
          # `&& exit 0` would take the step down with it under `set -e` when
          # there is a diff, which is the case this step exists for.
          if git diff --quiet README.md; then
            echo "The table did not change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update reliability results in README"
          git push
