name: Reliability

# What a tool does when things go wrong, published beside what it does when
# they do not.
#
# The suite is expensive — nine scenarios, three runs each, one tool at a time,
# which is hours — so it runs at two depths.
#
# A pull request that touches the suite gets a smoke run: one scenario per
# tool, once, which is enough to say whether every project still starts and
# indexes. It is posted back as a comment and changes nothing in the
# repository.
#
# The full suite runs weekly, and on demand, and that is what writes the table
# into the README. Nothing about these results changes between commits — they
# are a property of each tool, not of this repository — so measuring them on
# every push to main would be hours of runner time to learn the same thing
# again.
#
# The paths filter is what keeps this off pull requests that have nothing to do
# with it; the throughput benchmarks have their own workflow and their own
# scope filter.
#
# Nothing here needs an API token: the chain is generated by the benchmark and
# the tools are pointed at it, so this runs on a fork like anywhere else.

on:
  workflow_dispatch:
    inputs:
      tools:
        description: 'Tools to measure (space-separated). Leave empty for all.'
        required: false
        default: ''
        type: string
      scenarios:
        description: 'Scenarios to run (comma-separated). Leave empty for all.'
        required: false
        default: ''
        type: string
      repeats:
        description: 'Runs per scenario. A check passes only if every run passed.'
        required: false
        default: '3'
        type: string
  pull_request:
    paths:
      - 'reliability/**'
      - 'cases/lib/drivers/**'
      - 'cases/lib/process.ts'
      - 'cases/lib/verify.ts'
      - 'cases/lib/checksum.ts'
      - 'scripts/build-reliability-table.ts'
      - '.github/workflows/reliability.yml'
  schedule:
    # Weekly, well clear of the benchmark schedule: a full suite is hours of
    # runner time and nothing about it changes between commits.
    - cron: '0 3 * * 1'

jobs:
  scope:
    name: Scope
    runs-on: ubuntu-latest
    outputs:
      scenarios: ${{ steps.pick.outputs.scenarios }}
      repeats: ${{ steps.pick.outputs.repeats }}
      depth: ${{ steps.pick.outputs.depth }}
    steps:
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          SCENARIOS: ${{ inputs.scenarios }}
          REPEATS: ${{ inputs.repeats }}
        run: |
          # A pull request gets one scenario, once. It is the cheapest run that
          # still exercises every part of a project — the schema, the handlers,
          # the contract read, and the harness reading the tables back — so it
          # catches a project that no longer starts, which is what a pull
          # request can usefully be asked.
          if [ "$EVENT" = "pull_request" ]; then
            echo "scenarios=awkward-values" >> "$GITHUB_OUTPUT"
            echo "repeats=1" >> "$GITHUB_OUTPUT"
            echo "depth=smoke" >> "$GITHUB_OUTPUT"
          else
            echo "scenarios=${SCENARIOS}" >> "$GITHUB_OUTPUT"
            echo "repeats=${REPEATS:-3}" >> "$GITHUB_OUTPUT"
            echo "depth=full" >> "$GITHUB_OUTPUT"
          fi

  tools:
    name: ${{ matrix.tool }}
    needs: scope
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      # One tool at a time. The scenarios need the machine to themselves: two
      # of them measure how long a tool takes to react, and a neighbour
      # competing for CPU would show up as a tool that cannot keep up with the
      # head. A tool that fails is a result rather than a reason to stop
      # measuring the others.
      max-parallel: 1
      fail-fast: false
      matrix:
        # Kept in step with RELIABILITY_TOOLS in reliability/lib/tools.ts by
        # scripts/test-reliability.ts, which the Checks workflow runs.
        tool:
          - envio-rpc
          - envio-subgraph-rpc
          - ponder
          - rindexer
          - sqd-rpc
          - subgraph
          - subquery
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Run the reliability suite
        env:
          TOOL: ${{ matrix.tool }}
          SCENARIOS: ${{ needs.scope.outputs.scenarios }}
          REPEATS: ${{ needs.scope.outputs.repeats }}
          SELECTED: ${{ inputs.tools }}
        run: |
          # A dispatch that named tools narrows the matrix; a tool this job is
          # not for is skipped rather than failing the run.
          if [ -n "$SELECTED" ] && ! echo " $SELECTED " | grep -q " $TOOL "; then
            echo "$TOOL was not selected by this run."
            exit 0
          fi
          ARGS="$TOOL --repeats=$REPEATS"
          [ -n "$SCENARIOS" ] && ARGS="$ARGS --scenarios=$SCENARIOS"
          node reliability/run.ts $ARGS 2>&1 | tee reliability-output.txt

      - name: Upload the result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reliability-${{ matrix.tool }}
          path: reliability-output.txt
          retention-days: 30

  summary:
    name: Summary
    needs: [scope, tools]
    # A tool whose job failed is a result in its own right: the table carries
    # its last published row forward and marks it stale, which is the same
    # contract the throughput tables have.
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download the results
        uses: actions/download-artifact@v4
        with:
          path: results
          pattern: reliability-*

      # Always writes /tmp/reliability-table.md; only rewrites README.md when
      # told to, so a pull request publishes a comment and main publishes the
      # repository's own claim.
      - name: Build the reliability table
        env:
          UPDATE_README: ${{ github.event_name == 'pull_request' && '0' || '1' }}
        run: node scripts/build-reliability-table.ts | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Comment the results on the pull request
        if: github.event_name == 'pull_request' && !cancelled()
        uses: actions/github-script@v7
        env:
          DEPTH: ${{ needs.scope.outputs.depth }}
          SCENARIOS: ${{ needs.scope.outputs.scenarios }}
        with:
          script: |
            const fs = require('fs');
            const table = fs.existsSync('/tmp/reliability-table.md')
              ? fs.readFileSync('/tmp/reliability-table.md', 'utf8')
              : '_No reliability results collected._';
            const reported = fs.existsSync('/tmp/reliability-reported.txt')
              ? fs.readFileSync('/tmp/reliability-reported.txt', 'utf8').trim().split('\n').filter(Boolean)
              : [];

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            // Say exactly what was run. A smoke run fills one column and
            // leaves the rest dashed, and a reader who is not told that will
            // read the dashes as findings.
            const note = process.env.DEPTH === 'smoke'
              ? `A smoke run: \`${process.env.SCENARIOS}\` only, once per tool — enough to say `
                + `whether every project still starts and indexes. The other columns are `
                + `dashes because this run did not ask them, not because anything failed. `
                + `The full suite runs on \`main\`.`
              : '';

            const missing = [
              'envio-rpc', 'envio-subgraph-rpc', 'ponder', 'rindexer',
              'sqd-rpc', 'subgraph', 'subquery',
            ].length - reported.length;
            const failureNote = missing > 0
              ? `> ⚠️ ${missing} tool job(s) reported no result at all. Those rows show the last `
                + `published value; [check the failed job(s)](${runUrl}).`
              : '';

            const marker = '<!-- reliability-results -->';
            const body = [
              marker,
              '## Reliability',
              '',
              ...(note ? [note, ''] : []),
              ...(failureNote ? [failureNote, ''] : []),
              table,
              '',
              `[Full output](${runUrl}) is in the workflow run logs. `
                + `[What each check means](./reliability/README.md).`,
            ].join('\n');

            // Updated in place rather than appended, so a branch pushed ten
            // times has one comment that is current instead of ten that are
            // not.
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.data.find(c => c.body?.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Update README
        if: github.event_name != 'pull_request'
        run: |
          # `&& exit 0` would take the step down with it under `set -e` when
          # there is a diff, which is the case this step exists for.
          if git diff --quiet README.md; then
            echo "The table did not change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update reliability results in README"
          git push
