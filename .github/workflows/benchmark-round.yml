name: Benchmark round

# One pass over every scenario, called once per round by benchmarks.yml. A main
# run takes three rounds, one after another, so each tool is sampled three
# times about half an hour apart: the rows that swing are the ones reading a
# remote endpoint, and samples that far apart do not share its slow minutes.
# The summary publishes the median of them.
#
# It lives in its own file so the caller can chain whole rounds with `needs`
# the same way this file chains scenarios.

on:
  workflow_call:
    inputs:
      round:
        description: 'Round number; keeps each round''s artifacts apart'
        required: true
        type: string
      duration:
        description: 'Throughput window in seconds'
        required: true
        type: string
      windows:
        description: 'Throughput windows per indexer in each round'
        required: true
        type: string
      slots:
        description: 'JSON array of five {case, indexers} scenario slots, in run order; an unused slot has case ""'
        required: true
        type: string

jobs:
  # One scenario at a time: every indexer of scenario 1 runs in parallel, and
  # scenario 2 only starts once they have all finished. Keeping the scenarios
  # apart halves how many indexers hit the shared data endpoints at once, so a
  # scenario's numbers are not shaped by what the other scenario was doing.
  scenario-1:
    name: ${{ fromJSON(inputs.slots)[0].case }}
    if: fromJSON(inputs.slots)[0].case != ''
    uses: ./.github/workflows/benchmark-case.yml
    with:
      case: ${{ fromJSON(inputs.slots)[0].case }}
      indexers: ${{ toJSON(fromJSON(inputs.slots)[0].indexers) }}
      duration: ${{ inputs.duration }}
      windows: ${{ inputs.windows }}
      round: r${{ inputs.round }}
    secrets: inherit

  scenario-2:
    name: ${{ fromJSON(inputs.slots)[1].case }}
    needs: [scenario-1]
    # `!cancelled()` so a failing indexer in scenario 1 — which is a result in
    # its own right, not a reason to skip the rest of the run — still lets
    # scenario 2 start once scenario 1 is done, while cancelling the run still
    # stops it. `always()` would carry on through a cancel.
    if: ${{ !cancelled() && fromJSON(inputs.slots)[1].case != '' }}
    uses: ./.github/workflows/benchmark-case.yml
    with:
      case: ${{ fromJSON(inputs.slots)[1].case }}
      indexers: ${{ toJSON(fromJSON(inputs.slots)[1].indexers) }}
      duration: ${{ inputs.duration }}
      windows: ${{ inputs.windows }}
      round: r${{ inputs.round }}
    secrets: inherit

  scenario-3:
    name: ${{ fromJSON(inputs.slots)[2].case }}
    needs: [scenario-1, scenario-2]
    if: ${{ !cancelled() && fromJSON(inputs.slots)[2].case != '' }}
    uses: ./.github/workflows/benchmark-case.yml
    with:
      case: ${{ fromJSON(inputs.slots)[2].case }}
      indexers: ${{ toJSON(fromJSON(inputs.slots)[2].indexers) }}
      duration: ${{ inputs.duration }}
      windows: ${{ inputs.windows }}
      round: r${{ inputs.round }}
    secrets: inherit

  scenario-4:
    name: ${{ fromJSON(inputs.slots)[3].case }}
    needs: [scenario-1, scenario-2, scenario-3]
    if: ${{ !cancelled() && fromJSON(inputs.slots)[3].case != '' }}
    uses: ./.github/workflows/benchmark-case.yml
    with:
      case: ${{ fromJSON(inputs.slots)[3].case }}
      indexers: ${{ toJSON(fromJSON(inputs.slots)[3].indexers) }}
      duration: ${{ inputs.duration }}
      windows: ${{ inputs.windows }}
      round: r${{ inputs.round }}
    secrets: inherit

  scenario-5:
    name: ${{ fromJSON(inputs.slots)[4].case }}
    needs: [scenario-1, scenario-2, scenario-3, scenario-4]
    if: ${{ !cancelled() && fromJSON(inputs.slots)[4].case != '' }}
    uses: ./.github/workflows/benchmark-case.yml
    with:
      case: ${{ fromJSON(inputs.slots)[4].case }}
      indexers: ${{ toJSON(fromJSON(inputs.slots)[4].indexers) }}
      duration: ${{ inputs.duration }}
      windows: ${{ inputs.windows }}
      round: r${{ inputs.round }}
    secrets: inherit
