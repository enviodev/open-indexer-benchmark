name: Checks

# The harness's own tests, for the parts that need no credentials and no real
# indexer: the pull request scope filter, the result tables and their parser,
# the median and gate that turn a run's rounds into published rows,
# the mock chain the reliability scenarios serve, the reliability catalog and
# scoring, and the reliability harness itself - which is driven against an
# indexer with deliberate defects and has to catch each one.
#
# The first five run in a second or two. The last needs a PostgreSQL, which is
# why this job has one, and takes a few minutes; its slower scenarios are left
# out unless it is run with --full.
#
# The tests that are still deliberately absent - scripts/test-verification.ts
# and scripts/test-rpc-mock.ts - need a live HyperSync token, which forks do
# not have.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  harness:
    name: Harness tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/test-scope.ts
      - run: node scripts/test-tables.ts
      # How a run's rounds become one published row, and when the gate holds
      # one back - which otherwise only ever executes on a push to main.
      - run: node scripts/test-aggregate.ts
      - run: node scripts/test-chain-mock.ts
      # Also fails when reliability/README.md has fallen behind the
      # catalog, so a score can never link to an explanation of a check that
      # has since been rewritten.
      - run: node scripts/test-reliability.ts
      # The harness's own test: it drives every scenario against an indexer
      # with known defects and asserts that the checks catch them. Without it,
      # a published pass is only a claim that nothing was noticed. It needs a
      # database it may create databases on, and nothing else - the chain is
      # generated and the indexer under test is in this repository.
      - run: node scripts/test-reliability-harness.ts
        env:
          RELIABILITY_TEST_DB: postgresql://postgres:postgres@127.0.0.1:5432/postgres
