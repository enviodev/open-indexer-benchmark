name: Run Benchmarks

on:
  workflow_dispatch:
    inputs:
      indexers:
        description: 'Indexers to benchmark (space-separated). Leave empty for all.'
        required: false
        default: ''
        type: string
      cases:
        description: 'Cases to benchmark (space-separated). Leave empty for all.'
        required: false
        default: ''
        type: string
      duration:
        description: 'Benchmark duration in seconds'
        required: false
        default: '60'
        type: string
  push:
    branches: [main]
  pull_request:

jobs:
  setup:
    name: Setup matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      cases: ${{ steps.set-matrix.outputs.cases }}
      duration: ${{ steps.set-matrix.outputs.duration }}
    steps:
      - id: set-matrix
        run: |
          INDEXERS="${{ inputs.indexers }}"
          if [ -z "$INDEXERS" ]; then
            echo 'matrix=["envio","envio-rpc","ponder","rindexer","subquery","sqd"]' >> "$GITHUB_OUTPUT"
          else
            MATRIX=$(echo "$INDEXERS" | tr ' ' '\n' | jq -R . | jq -sc .)
            echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          fi
          CASES="${{ inputs.cases }}"
          if [ -z "$CASES" ]; then
            echo 'cases=["erc20-account-balances","erc20-transfer-events"]' >> "$GITHUB_OUTPUT"
          else
            CASES_JSON=$(echo "$CASES" | tr ' ' '\n' | jq -R . | jq -sc .)
            echo "cases=$CASES_JSON" >> "$GITHUB_OUTPUT"
          fi
          DURATION="${{ inputs.duration }}"
          echo "duration=${DURATION:-60}" >> "$GITHUB_OUTPUT"

  benchmark:
    name: "Benchmark: ${{ matrix.case }} / ${{ matrix.indexer }}"
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # Run benchmark jobs strictly one at a time. GitHub gives each matrix job
      # its own runner VM, so local compute (CPU/RAM/Postgres) is already
      # isolated — but every job shares one Envio RPC/HyperSync token, and that
      # shared endpoint is the resource the per-job VMs do NOT isolate. Running
      # jobs concurrently makes them compete for it, starving the RPC-bound
      # indexers (HTTP 503s, 0-progress results). Serialising gives each indexer
      # the full, uncontended endpoint — the fair, reproducible condition a
      # benchmark needs. The cost is CI wall-clock time, which is acceptable here.
      max-parallel: 1
      matrix:
        case: ${{ fromJSON(needs.setup.outputs.cases) }}
        indexer: ${{ fromJSON(needs.setup.outputs.matrix) }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testing
          POSTGRES_DB: envio-dev
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Prepare services
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          INDEXER="${{ matrix.indexer }}"
          CASE_DIR="cases/${{ matrix.case }}"

          # Pre-pull Docker images so pulls don't count toward benchmark time
          case "$INDEXER" in
            ponder)
              docker pull postgres:17-alpine
              ;;
            rindexer)
              docker compose -f "$CASE_DIR/rindexer/docker-compose.yml" pull
              # install.sh resolves "latest" via an UNAUTHENTICATED GitHub API
              # call (60 req/h, shared across Actions runners) and does not guard
              # an empty result: when throttled the version is blank and the
              # download URL 404s (".../releases/download/v/..."), failing the job
              # and silently dropping rindexer from the table. Resolve the tag
              # ourselves with an authenticated call (5000 req/h) and pin it via
              # --version, which still tracks the latest release.
              RINDEXER_VERSION=""
              for i in 1 2 3; do
                RINDEXER_VERSION=$(curl -fsSL \
                  -H "Authorization: Bearer $GITHUB_TOKEN" \
                  -H "Accept: application/vnd.github+json" \
                  https://api.github.com/repos/joshstevens19/rindexer/releases/latest \
                  | jq -r '.tag_name // empty' | sed 's/^v//') || true
                [ -n "$RINDEXER_VERSION" ] && break
                echo "rindexer version lookup attempt $i failed; retrying..." >&2
                sleep $((i * 5))
              done
              if [ -z "$RINDEXER_VERSION" ]; then
                echo "Failed to resolve latest rindexer version" >&2
                exit 1
              fi
              echo "Installing rindexer v$RINDEXER_VERSION"
              curl -L https://rindexer.xyz/install.sh | bash -s -- --version "$RINDEXER_VERSION"
              ;;
            subquery)
              docker compose -f "$CASE_DIR/subquery/docker-compose.yml" pull
              docker compose -f "$CASE_DIR/subquery/docker-compose.yml" build
              ;;
            sqd)
              docker compose -f "$CASE_DIR/sqd/docker-compose.yml" pull
              ;;
          esac

      - name: Run benchmark
        run: |
          set -o pipefail
          node cases/${{ matrix.case }}/run.ts ${{ matrix.indexer }} --duration="${{ needs.setup.outputs.duration }}" 2>&1 | tee /tmp/benchmark-output.txt
        env:
          ENVIO_API_TOKEN: ${{ secrets.ENVIO_API_TOKEN }}
          # Sqd's archive (v2.archive.subsquid.io) requires an API key as of
          # 19 May 2026. The @subsquid archive client reads it from SQD_API_KEY.
          # Get a key at https://portal.sqd.dev and add it as the SQD_API_KEY
          # repo secret. Without it, the sqd jobs report 0 (CREDENTIALS_INVALID).
          SQD_API_KEY: ${{ secrets.SQD_API_KEY }}

      - name: Post results to job summary
        if: always()
        run: |
          echo "## ${{ matrix.case }} / ${{ matrix.indexer }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/benchmark-output.txt 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || echo "No output captured" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ matrix.case }}--${{ matrix.indexer }}
          path: /tmp/benchmark-output.txt
          if-no-files-found: ignore

  summary:
    name: Summary
    needs: [setup, benchmark]
    if: always() && needs.setup.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all results
        uses: actions/download-artifact@v4
        with:
          path: results
          pattern: benchmark-*

      - name: Build comparison tables
        id: build-table
        uses: actions/github-script@v7
        env:
          CASES: ${{ needs.setup.outputs.cases }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const cases = JSON.parse(process.env.CASES);
            const resultsDir = 'results';

            // The checked-out README holds the currently published tables; we
            // read it so we can carry forward any indexer that produced no fresh
            // result this run (see the carry-forward block below).
            const readmeText = fs.existsSync('README.md')
              ? fs.readFileSync('README.md', 'utf8')
              : '';

            // Summary lines look like:
            //   "Summary — Envio (40s): 77,177.0 blocks/s, 9,984.0 events/s"
            //   "Summary — Ponder: 502.0 blocks/s, 44.0 events/s"
            // The "(40s)" suffix is part of the local Summary line so non-
            // baseline windows are visible in CI logs, but the table column
            // headers strip it to keep names tidy.
            const SUMMARY_RE = /Summary — (.+?): ([\d,.]+) blocks\/s, ([\d,.]+) events\/s/;
            const stripDurationTag = name => name.replace(/\s\(\d+s\)$/, '');

            const titleCase = c =>
              c.split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');

            // Extract { name: {blocksPerSec, eventsPerSec} } from a case's
            // published table (between its BENCHMARK markers in the README), so a
            // missing indexer can be carried forward instead of silently dropped.
            const parsePublishedTable = (md, benchCase) => {
              const startMarker = `<!-- BENCHMARK:${benchCase}:START -->`;
              const endMarker = `<!-- BENCHMARK:${benchCase}:END -->`;
              const start = md.indexOf(startMarker);
              const end = md.indexOf(endMarker);
              if (start === -1 || end === -1 || end < start) return {};
              const rows = md.slice(start + startMarker.length, end)
                .split('\n')
                .filter(l => l.trim().startsWith('|'));
              const cellsOf = l => l.split('|').slice(1, -1).map(s => s.trim());
              let header, blocks, events;
              for (const l of rows) {
                const c = cellsOf(l);
                if (c[0] === '') header = c;
                else if (/^blocks\/s$/i.test(c[0])) blocks = c;
                else if (/^events\/s$/i.test(c[0])) events = c;
              }
              if (!header || !blocks || !events) return {};
              const names = header.slice(1).map(n => n.replace(/\s*\(\d+(?:\.\d+)?x slower\)\s*$/, '').trim());
              const out = {};
              for (let i = 0; i < names.length; i++) {
                const b = parseFloat((blocks[i + 1] || '').replace(/,/g, ''));
                const e = parseFloat((events[i + 1] || '').replace(/,/g, ''));
                if (names[i] && Number.isFinite(b) && Number.isFinite(e)) {
                  out[names[i]] = { blocksPerSec: b, eventsPerSec: e };
                }
              }
              return out;
            };

            // Artifact dirs are named "benchmark-<case>--<indexer>".
            const dirs = fs.existsSync(resultsDir)
              ? fs.readdirSync(resultsDir).sort()
              : [];

            for (const benchCase of cases) {
              const prefix = `benchmark-${benchCase}--`;
              const results = [];

              for (const dir of dirs) {
                if (!dir.startsWith(prefix)) continue;
                const file = path.join(resultsDir, dir, 'benchmark-output.txt');
                if (!fs.existsSync(file)) continue;
                const content = fs.readFileSync(file, 'utf8');
                const match = content.match(SUMMARY_RE);
                if (match) {
                  results.push({
                    name: stripDurationTag(match[1]),
                    blocksPerSec: parseFloat(match[2].replace(/,/g, '')),
                    eventsPerSec: parseFloat(match[3].replace(/,/g, '')),
                  });
                }
              }

              const heading = titleCase(benchCase);

              // Carry forward any previously published indexer with no fresh
              // result this run (failed job / no Summary line). Rebuilding the
              // table only from successful runs would silently drop the column.
              const prior = parsePublishedTable(readmeText, benchCase);
              const haveNames = new Set(results.map(r => r.name));
              const carried = [];
              for (const [name, vals] of Object.entries(prior)) {
                if (!haveNames.has(name)) {
                  results.push({ name, blocksPerSec: vals.blocksPerSec, eventsPerSec: vals.eventsPerSec });
                  carried.push(name);
                }
              }
              if (carried.length) {
                core.warning(
                  `${heading}: no fresh result for ${carried.join(', ')} this run — ` +
                  `carried forward the last published value(s). Check the failed benchmark job(s).`
                );
              }

              if (results.length === 0) {
                core.summary.addRaw(`## ${heading} Benchmark\n\n_No results collected._\n`);
                continue;
              }

              results.sort((a, b) => b.blocksPerSec - a.blocksPerSec);
              const firstRate = results[0].blocksPerSec;
              const fmtRate = n => n.toLocaleString('en-US', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
              const label = (r, i) => {
                if (i === 0 || results.length === 1) return r.name;
                const ratio = firstRate / r.blocksPerSec;
                const n = ratio % 1 === 0 ? String(Math.round(ratio)) : ratio.toFixed(1);
                return `${r.name} (${n}x slower)`;
              };

              const header = `| | ${results.map((r, i) => label(r, i)).join(' | ')} |`;
              const sep = `| --- | ${results.map(() => '---').join(' | ')} |`;
              const blocksRow = `| blocks/s | ${results.map(r => fmtRate(r.blocksPerSec)).join(' | ')} |`;
              const eventsRow = `| events/s | ${results.map(r => fmtRate(r.eventsPerSec)).join(' | ')} |`;
              const table = [header, sep, blocksRow, eventsRow].join('\n');

              core.summary.addRaw(`## ${heading} Benchmark\n\n${table}\n`);
              if (carried.length) {
                core.summary.addRaw(`\n> ⚠️ Carried forward last published value(s) for **${carried.join(', ')}** — no fresh result this run.\n`);
              }
              fs.writeFileSync(`/tmp/benchmark-table-${benchCase}.md`, table);
            }

            await core.summary.write();

      - name: Comment results on PR
        if: github.event_name == 'pull_request' && !cancelled()
        uses: actions/github-script@v7
        env:
          CASES: ${{ needs.setup.outputs.cases }}
        with:
          script: |
            const fs = require('fs');

            const cases = JSON.parse(process.env.CASES);
            const titleCase = c =>
              c.split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');

            const sections = [];
            for (const benchCase of cases) {
              const file = `/tmp/benchmark-table-${benchCase}.md`;
              const table = fs.existsSync(file)
                ? fs.readFileSync(file, 'utf8')
                : '_No results collected._';
              sections.push(`### ${titleCase(benchCase)}\n\n${table}`);
            }

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const body = [
              '## Benchmark Results',
              '',
              sections.join('\n\n'),
              '',
              `[Full output](${runUrl}) is available in the workflow run logs.`,
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      - name: Update README
        if: github.event_name == 'push'
        env:
          CASES: ${{ needs.setup.outputs.cases }}
        run: |
          CHANGED=0
          for CASE in $(echo "$CASES" | jq -r '.[]'); do
            TABLE="/tmp/benchmark-table-${CASE}.md"
            [ -f "$TABLE" ] || continue

            # Replace content between this case's markers with the new table
            awk -v start="<!-- BENCHMARK:${CASE}:START -->" \
                -v end="<!-- BENCHMARK:${CASE}:END -->" \
                -v tablefile="$TABLE" '
              $0 ~ start { print; while ((getline line < tablefile) > 0) print line; skip=1; next }
              $0 ~ end { skip=0 }
              !skip { print }
            ' README.md > README.tmp && mv README.tmp README.md
            CHANGED=1
          done

          [ "$CHANGED" = "1" ] || exit 0
          git diff --quiet README.md && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update benchmark results in README"
          git push
