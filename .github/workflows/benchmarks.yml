name: Run Benchmarks

on:
  workflow_dispatch:
    inputs:
      indexers:
        description: 'Indexers to benchmark (space-separated). Leave empty for all.'
        required: false
        default: ''
        type: string
      cases:
        description: 'Cases to benchmark (space-separated). Leave empty for all.'
        required: false
        default: ''
        type: string
      duration:
        description: 'Benchmark duration in seconds'
        required: false
        default: '100'
        type: string
      rounds:
        description: 'Times to measure each indexer, 1-3; the median is published. Pushes to main always take 3.'
        required: false
        default: '1'
        type: string
  push:
    branches: [main]
  # Disabled on pull requests while the reliability suite is being built out.
  # Forty-four jobs of throughput measurement, none of which a change to the
  # reliability suite can affect, were the slowest thing on every one of its
  # pull requests. `main` still publishes the tables, and a dispatch still runs
  # whatever is asked for. Uncomment to get the per-pull-request tables back.
  #
  # pull_request:

# One run per branch at a time. Two runs side by side double how many indexers
# hit the shared data endpoints at once, which is the noise the rest of this
# workflow goes to lengths to keep out. On main a new push waits rather than
# cancelling: the run in flight publishes the table. GitHub keeps one pending
# run per group, so a burst of merges collapses to the run in flight plus the
# newest. On a pull request the newer push makes the older run moot.
concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  setup:
    name: Setup matrix
    runs-on: ubuntu-latest
    # Reads the diff to scope pull request runs; touches nothing else.
    permissions:
      contents: read
    outputs:
      cases: ${{ steps.set-matrix.outputs.cases }}
      case1: ${{ steps.set-matrix.outputs.case1 }}
      case2: ${{ steps.set-matrix.outputs.case2 }}
      case3: ${{ steps.set-matrix.outputs.case3 }}
      case4: ${{ steps.set-matrix.outputs.case4 }}
      case5: ${{ steps.set-matrix.outputs.case5 }}
      indexers1: ${{ steps.set-matrix.outputs.indexers1 }}
      indexers2: ${{ steps.set-matrix.outputs.indexers2 }}
      indexers3: ${{ steps.set-matrix.outputs.indexers3 }}
      indexers4: ${{ steps.set-matrix.outputs.indexers4 }}
      indexers5: ${{ steps.set-matrix.outputs.indexers5 }}
      partial: ${{ steps.set-matrix.outputs.partial }}
      selected: ${{ steps.set-matrix.outputs.selected }}
      duration: ${{ steps.set-matrix.outputs.duration }}
      rounds: ${{ steps.set-matrix.outputs.rounds }}
      gate: ${{ steps.set-matrix.outputs.gate }}
      touched: ${{ steps.set-matrix.outputs.touched }}
    steps:
      # Needed on every event: the step below runs scripts/case-indexers.ts to
      # work out which tools each scenario implements, whether or not the run
      # is a pull request. Only the diff-based scope filter is pull-request
      # only, and that is what the full history is for.
      - uses: actions/checkout@v4
        with:
          # The pull request scope comes from `git diff` against the base
          # commit, which a shallow clone does not have. Unconditional, and not
          # `event_name == 'pull_request' && 0 || 1`: that reads as "full
          # history on a pull request" and yields 1 on every event, because 0
          # is falsy to a GitHub expression.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - id: set-matrix
        # Dispatch inputs are read from the environment rather than expanded
        # into the script text, so they reach the shell as data.
        env:
          INDEXERS: ${{ inputs.indexers }}
          CASES: ${{ inputs.cases }}
          DURATION_INPUT: ${{ inputs.duration }}
          ROUNDS_INPUT: ${{ inputs.rounds }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ -z "$INDEXERS" ]; then
            # Every registered indexer, whether or not a scenario runs it: the
            # per-scenario intersection below is what decides that, and a name
            # missing from here would silently never get a job.
            INDEXERS_JSON='["envio","envio-rpc","envio-subgraph","envio-subgraph-rpc","ponder","rindexer","rindexer-hypersync","subgraph","subquery","sqd","sqd-rpc","carbon","substreams"]'
          else
            INDEXERS_JSON=$(echo "$INDEXERS" | tr ' ' '\n' | grep -v '^$' | jq -R . | jq -sc .)
          fi
          if [ -z "$CASES" ]; then
            CASES_JSON='["erc20-account-balances","erc20-transfer-events","erc20-allowance-calls","safe-factory-registrations","solana-spl-transfers"]'
          else
            CASES_JSON=$(echo "$CASES" | tr ' ' '\n' | grep -v '^$' | jq -R . | jq -sc .)
          fi

          COUNT=$(echo "$CASES_JSON" | jq 'length')

          # An input of nothing but separators splits into no scenarios at all.
          # Left alone every scenario job would skip and the summary would still
          # publish an empty table, which reads as "measured, found nothing".
          if [ "$COUNT" -eq 0 ]; then
            echo "No scenarios resolved from the cases input." >&2
            exit 1
          fi

          # Scenarios run one after another, which needs one `needs`-chained job
          # per scenario in benchmark-round.yml — GitHub cannot order a matrix.
          # That makes the number of scenario slots fixed: adding a sixth
          # scenario means adding a sixth `scenario-N` job (and its inputs)
          # there, and passing it from each round below. Fail loudly rather than silently
          # dropping the extra scenario from the run and from the table.
          if [ "$COUNT" -gt 5 ]; then
            echo "Only 5 scenarios can run per workflow run; add a scenario-N job to benchmark-round.yml." >&2
            exit 1
          fi

          # Every scenario measures every indexer, unless a pull request
          # narrows it: there a full run is forty-four long jobs against shared
          # data endpoints, nearly all of them re-measuring untouched code.
          # `main` and manual runs stay full — they publish the README table,
          # which has to hold a complete set of results.
          PARTIAL=0
          # Both empty unless the run is scoped. SELECTED lets the summary tell
          # an indexer that was asked to run and reported nothing — a failed
          # job — apart from one this run never selected.
          SCOPE=""
          SELECTED=""

          if [ "$EVENT_NAME" = "pull_request" ]; then
            # The filter has no execution path other than right here, so it
            # vouches for itself before it decides anything.
            node scripts/test-scope.ts

            # HEAD is the merge commit GitHub built against the base. The
            # event's base sha can lag the merge base it actually used, in
            # which case files from the base branch leak into the diff — that
            # only ever widens the selection, never narrows it.
            #
            # A base commit the clone does not have — the base branch was
            # force-pushed after the event fired — leaves nothing to diff, and
            # an empty file list would read as "nothing changed" and skip the
            # run. The filter only ever narrows, so an unknown base leaves the
            # run unscoped instead.
            if git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
              CHANGED_FILES=$(git diff --name-only "$BASE_SHA" HEAD)
              echo "Changed files:"
              echo "$CHANGED_FILES" | sed 's/^/  /'

              SCOPE=$(CHANGED_FILES="$CHANGED_FILES" ALL_CASES="$CASES_JSON" \
                ALL_INDEXERS="$INDEXERS_JSON" node scripts/select-scope.ts)
              echo "Scope: $SCOPE"

              CASES_JSON=$(echo "$SCOPE" | jq -c '.cases')
              SELECTED=$(echo "$SCOPE" | jq -c '.indexers')
              [ "$(echo "$SCOPE" | jq '.full')" = "true" ] || PARTIAL=1

              if [ "$CASES_JSON" = "[]" ]; then
                echo "Nothing benchmark-related changed; skipping the benchmark run."
              fi
            else
              echo "Base commit $BASE_SHA is not in this clone; running unscoped." >&2
            fi
          fi

          # A scenario only runs the tools it has a project for. Without this a
          # scenario no one has ported yet spawns a job per tool that fails on
          # a missing directory, which reads as a broken benchmark rather than
          # as an implementation nobody has written.
          AVAILABLE=$(ALL_CASES="$CASES_JSON" ALL_INDEXERS="$INDEXERS_JSON" \
            node scripts/case-indexers.ts)
          echo "Available per scenario: $AVAILABLE"

          # The summary reads SELECTED to tell a job that failed apart from one
          # this run never asked for, so it has to be narrowed the same way the
          # matrix is — otherwise a tool a scenario does not implement is
          # reported as a job that produced nothing.
          if [ -n "$SELECTED" ]; then
            SELECTED=$(jq -cn --argjson sel "$SELECTED" --argjson avail "$AVAILABLE" \
              'reduce ($sel | keys_unsorted[]) as $k ({};
                 .[$k] = ($sel[$k] - ($sel[$k] - ($avail[$k] // []))))')
          fi

          echo "cases=$CASES_JSON" >> "$GITHUB_OUTPUT"
          echo "partial=$PARTIAL" >> "$GITHUB_OUTPUT"
          echo "selected=$SELECTED" >> "$GITHUB_OUTPUT"

          # One scenario slot per `scenario-N` job in benchmark-round.yml. A slot with no case
          # is skipped by that job's `if`, so the loop covers a run with fewer
          # scenarios than slots without special-casing it.
          for N in 1 2 3 4 5; do
            CASE_N=$(echo "$CASES_JSON" | jq -r --argjson i "$((N - 1))" '.[$i] // ""')
            if [ -n "$SCOPE" ]; then
              INDEXERS_N=$(echo "$SCOPE" | jq -c --arg c "$CASE_N" '.indexers[$c] // []')
            else
              INDEXERS_N="$INDEXERS_JSON"
            fi
            # Intersect with what the scenario implements, keeping order.
            INDEXERS_N=$(jq -cn --argjson want "$INDEXERS_N" \
              --argjson have "$(echo "$AVAILABLE" | jq -c --arg c "$CASE_N" '.[$c] // []')" \
              '$want - ($want - $have)')
            echo "case$N=$CASE_N" >> "$GITHUB_OUTPUT"
            echo "indexers$N=$INDEXERS_N" >> "$GITHUB_OUTPUT"
          done

          echo "duration=${DURATION_INPUT:-100}" >> "$GITHUB_OUTPUT"

          # How many times each indexer is measured. A push to main publishes
          # the README table, so it takes three samples and publishes their
          # median; a pull request takes one, so iterating on it stays as fast
          # as it was. There are three round slots below, hence the ceiling.
          if [ "$EVENT_NAME" = "push" ]; then
            ROUNDS=3
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            ROUNDS="${ROUNDS_INPUT:-1}"
          else
            ROUNDS=1
          fi
          case "$ROUNDS" in
            1|2|3) ;;
            *) echo "rounds must be 1, 2 or 3, not '$ROUNDS'." >&2; exit 1 ;;
          esac
          echo "rounds=$ROUNDS" >> "$GITHUB_OUTPUT"

          # Only a push publishes, so only a push is gated: a row that moved a
          # long way from the README, whose runs disagree, is measured again
          # before it replaces the published value.
          if [ "$EVENT_NAME" = "push" ]; then
            echo "gate=recheck" >> "$GITHUB_OUTPUT"
          else
            echo "gate=off" >> "$GITHUB_OUTPUT"
          fi

          # The rows this push changed the code of, worked out by the same
          # filter that scopes a pull request. Those are expected to move, so
          # the gate lets them through. A push whose previous commit is not in
          # the clone — the first push of a branch, or a force-push — touches
          # nothing as far as the gate knows, which costs at most a recheck.
          TOUCHED='{}'
          if [ "$EVENT_NAME" = "push" ] && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            TOUCHED=$(CHANGED_FILES="$(git diff --name-only "$BEFORE_SHA" HEAD)" \
              ALL_CASES="$CASES_JSON" ALL_INDEXERS="$INDEXERS_JSON" \
              node scripts/select-scope.ts | jq -c '.indexers')
          fi
          echo "Touched by this push: $TOUCHED"
          echo "touched=$TOUCHED" >> "$GITHUB_OUTPUT"

  # The harness has four test scripts — scripts/test-verification.ts,
  # scripts/test-tables.ts, scripts/test-rpc-mock.ts and scripts/test-scope.ts —
  # that are run locally when the verification layer, the result table, the
  # endpoint that serves a case's contract calls, or the pull request run filter
  # changes. They are deliberately not a CI job: the verification test needs a
  # live HyperSync token, which forks do not have. The one exception is
  # test-scope.ts, which the setup job runs before trusting the filter's
  # decision, since it needs no credentials and takes under a second.

  # Each round is one pass over every scenario, scenario after scenario (see
  # benchmark-round.yml). Rounds run one after another rather than side by
  # side: running them at once would triple the load on the shared endpoints
  # and put all three samples in the same slow minute, which is exactly the
  # noise the extra samples are there to average out.
  round-1:
    name: Round 1
    needs: setup
    if: needs.setup.outputs.case1 != ''
    uses: ./.github/workflows/benchmark-round.yml
    with:
      round: '1'
      duration: ${{ needs.setup.outputs.duration }}
      case1: ${{ needs.setup.outputs.case1 }}
      case2: ${{ needs.setup.outputs.case2 }}
      case3: ${{ needs.setup.outputs.case3 }}
      case4: ${{ needs.setup.outputs.case4 }}
      case5: ${{ needs.setup.outputs.case5 }}
      indexers1: ${{ needs.setup.outputs.indexers1 }}
      indexers2: ${{ needs.setup.outputs.indexers2 }}
      indexers3: ${{ needs.setup.outputs.indexers3 }}
      indexers4: ${{ needs.setup.outputs.indexers4 }}
      indexers5: ${{ needs.setup.outputs.indexers5 }}
    secrets: inherit

  round-2:
    name: Round 2
    needs: [setup, round-1]
    # `always()` for the same reason the scenarios use it: a failed job in
    # round 1 is a result, not a reason to take fewer samples of the rest.
    if: always() && needs.setup.result == 'success' && needs.setup.outputs.case1 != '' && fromJSON(needs.setup.outputs.rounds) >= 2
    uses: ./.github/workflows/benchmark-round.yml
    with:
      round: '2'
      duration: ${{ needs.setup.outputs.duration }}
      case1: ${{ needs.setup.outputs.case1 }}
      case2: ${{ needs.setup.outputs.case2 }}
      case3: ${{ needs.setup.outputs.case3 }}
      case4: ${{ needs.setup.outputs.case4 }}
      case5: ${{ needs.setup.outputs.case5 }}
      indexers1: ${{ needs.setup.outputs.indexers1 }}
      indexers2: ${{ needs.setup.outputs.indexers2 }}
      indexers3: ${{ needs.setup.outputs.indexers3 }}
      indexers4: ${{ needs.setup.outputs.indexers4 }}
      indexers5: ${{ needs.setup.outputs.indexers5 }}
    secrets: inherit

  round-3:
    name: Round 3
    needs: [setup, round-1, round-2]
    if: always() && needs.setup.result == 'success' && needs.setup.outputs.case1 != '' && fromJSON(needs.setup.outputs.rounds) >= 3
    uses: ./.github/workflows/benchmark-round.yml
    with:
      round: '3'
      duration: ${{ needs.setup.outputs.duration }}
      case1: ${{ needs.setup.outputs.case1 }}
      case2: ${{ needs.setup.outputs.case2 }}
      case3: ${{ needs.setup.outputs.case3 }}
      case4: ${{ needs.setup.outputs.case4 }}
      case5: ${{ needs.setup.outputs.case5 }}
      indexers1: ${{ needs.setup.outputs.indexers1 }}
      indexers2: ${{ needs.setup.outputs.indexers2 }}
      indexers3: ${{ needs.setup.outputs.indexers3 }}
      indexers4: ${{ needs.setup.outputs.indexers4 }}
      indexers5: ${{ needs.setup.outputs.indexers5 }}
    secrets: inherit

  # Takes the median of every round and holds back the rows that moved a long
  # way from the README without their runs agreeing where to. Publishes nothing
  # itself; `publish` does, once any recheck is in.
  aggregate:
    name: Aggregate
    needs: [setup, round-1, round-2, round-3]
    if: always() && needs.setup.result == 'success' && needs.setup.outputs.case1 != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      recheck_cases: ${{ steps.gate.outputs.cases }}
      recheck_indexers: ${{ steps.gate.outputs.indexers }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download all results
        uses: actions/download-artifact@v4
        with:
          path: results
          pattern: benchmark-*

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - id: gate
        env:
          CASES: ${{ needs.setup.outputs.cases }}
          SELECTED_INDEXERS: ${{ needs.setup.outputs.selected }}
          GATE: ${{ needs.setup.outputs.gate }}
          TOUCHED_INDEXERS: ${{ needs.setup.outputs.touched }}
          # This job's tables are a preview; publish writes the real ones.
          WRITE_SUMMARY: '0'
        run: |
          node scripts/build-tables.ts
          RECHECK=$(cat /tmp/benchmark-recheck.json 2>/dev/null || echo '{}')
          # Kept in the order the scenarios ran in, so the recheck does too.
          CASES_TO_RECHECK=$(jq -cn --argjson all "$CASES" --argjson r "$RECHECK" \
            '[$all[] | select(($r[.] // []) | length > 0)]')
          echo "cases=$CASES_TO_RECHECK" >> "$GITHUB_OUTPUT"
          echo "indexers=$RECHECK" >> "$GITHUB_OUTPUT"

  # A fourth sample of each row the gate held back, one scenario at a time like
  # every other round. Skipped entirely on the usual run, where nothing moved.
  recheck:
    name: Recheck ${{ matrix.case }}
    needs: [setup, aggregate]
    if: needs.aggregate.outputs.recheck_cases != '' && needs.aggregate.outputs.recheck_cases != '[]'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        case: ${{ fromJSON(needs.aggregate.outputs.recheck_cases) }}
    uses: ./.github/workflows/benchmark-case.yml
    with:
      case: ${{ matrix.case }}
      indexers: ${{ toJSON(fromJSON(needs.aggregate.outputs.recheck_indexers)[matrix.case]) }}
      duration: ${{ needs.setup.outputs.duration }}
      round: recheck
    secrets: inherit

  publish:
    name: Publish
    needs: [setup, aggregate, recheck]
    # A pull request that changed nothing benchmark-related runs no scenario,
    # so there is nothing to tabulate — and an empty table reads as "measured,
    # found nothing" rather than "not measured". A recheck that failed still
    # publishes: the rows it was for fall back to the rounds' samples, flagged.
    if: always() && needs.setup.result == 'success' && needs.setup.outputs.case1 != '' && needs.aggregate.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The README commit is rebased onto whatever main has gained during
          # the run, which needs the history to rebase over.
          fetch-depth: 0

      - name: Download all results
        uses: actions/download-artifact@v4
        with:
          path: results
          pattern: benchmark-*

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build comparison tables
        env:
          CASES: ${{ needs.setup.outputs.cases }}
          SELECTED_INDEXERS: ${{ needs.setup.outputs.selected }}
          # The recheck has had its turn, so a row that still disagrees is
          # published with a note rather than held back again.
          GATE: ${{ needs.setup.outputs.gate == 'off' && 'off' || 'final' }}
          TOUCHED_INDEXERS: ${{ needs.setup.outputs.touched }}
        run: node scripts/build-tables.ts

      - name: Comment results on PR
        if: github.event_name == 'pull_request' && !cancelled()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SECTION: benchmarks
          CASES: ${{ needs.setup.outputs.cases }}
          PARTIAL_RUN: ${{ needs.setup.outputs.partial }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "## Benchmark Results"
            echo

            # Say so when the run was narrowed, so a ⚠️ row reads as "not
            # re-run by this pull request" rather than "this indexer broke".
            if [ "$PARTIAL_RUN" = "1" ]; then
              echo "Only the scenarios and indexers this pull request touches were re-run;"
              echo "other rows are carried forward from the last published results, and"
              echo "untouched scenarios are left out entirely."
              echo
            fi

            # An indexer that WAS selected and still produced nothing is a
            # failed job, and must not hide behind the scope note above -
            # build-tables.ts writes one list per case where that happened.
            FAILURES=""
            for CASE in $(echo "$CASES" | jq -r '.[]'); do
              FILE="/tmp/benchmark-failed-${CASE}.txt"
              [ -s "$FILE" ] || continue
              TITLE=$(cat "/tmp/benchmark-title-${CASE}.txt" 2>/dev/null || echo "$CASE")
              NAMES=$(paste -sd", " "$FILE")
              FAILURES="${FAILURES}${FAILURES:+; }${TITLE}: ${NAMES}"
            done
            if [ -n "$FAILURES" ]; then
              echo "> ⚠️ Selected to run but reported no result - ${FAILURES}."
              echo "> These rows show the last published value; [check the failed job(s)]($RUN_URL)."
              echo
            fi

            # Scenario names come from each case config via build-tables.ts, so
            # the comment matches the README; the slug is the fallback.
            for CASE in $(echo "$CASES" | jq -r '.[]'); do
              TITLE=$(cat "/tmp/benchmark-title-${CASE}.txt" 2>/dev/null || echo "$CASE")
              echo "### ${TITLE}"
              echo
              if [ -f "/tmp/benchmark-table-${CASE}.md" ]; then
                cat "/tmp/benchmark-table-${CASE}.md"
              else
                echo "_No results collected._"
              fi
              echo
            done

            echo "[Full output]($RUN_URL) is available in the workflow run logs."
          } > /tmp/benchmark-comment.md

          node scripts/pr-comment.ts /tmp/benchmark-comment.md

      - name: Update README
        if: github.event_name == 'push'
        env:
          CASES: ${{ needs.setup.outputs.cases }}
        run: |
          CHANGED=0
          for CASE in $(echo "$CASES" | jq -r '.[]'); do
            # The README variant, without this run's carried-forward marks.
            TABLE="/tmp/benchmark-readme-${CASE}.md"
            [ -f "$TABLE" ] || continue

            # Replace content between this case's markers with the new table
            awk -v start="<!-- BENCHMARK:${CASE}:START -->" \
                -v end="<!-- BENCHMARK:${CASE}:END -->" \
                -v tablefile="$TABLE" '
              $0 ~ start { print; while ((getline line < tablefile) > 0) print line; skip=1; next }
              $0 ~ end { skip=0 }
              !skip { print }
            ' README.md > README.tmp && mv README.tmp README.md
            CHANGED=1
          done

          [ "$CHANGED" = "1" ] || exit 0
          git diff --quiet README.md && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update benchmark results in README"
          # A main run takes well over an hour, so main has usually moved on by
          # the time it finishes. The commit only touches the table blocks, so
          # it rebases cleanly onto anything that did not rewrite them.
          for i in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push && exit 0
            echo "Push attempt $i failed; retrying..." >&2
            sleep $((i * 10))
          done
          exit 1
