name: Run Benchmarks

on:
  workflow_dispatch:
    inputs:
      indexers:
        description: 'Indexers to benchmark (space-separated). Leave empty for all.'
        required: false
        default: ''
        type: string
      cases:
        description: 'Cases to benchmark (space-separated). Leave empty for all.'
        required: false
        default: ''
        type: string
      duration:
        description: 'Benchmark duration in seconds'
        required: false
        default: '60'
        type: string
  push:
    branches: [main]
  pull_request:

jobs:
  setup:
    name: Setup matrix
    runs-on: ubuntu-latest
    # Only echoes the matrix to GITHUB_OUTPUT; touches neither repo nor API.
    permissions: {}
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      cases: ${{ steps.set-matrix.outputs.cases }}
      duration: ${{ steps.set-matrix.outputs.duration }}
    steps:
      - id: set-matrix
        run: |
          INDEXERS="${{ inputs.indexers }}"
          if [ -z "$INDEXERS" ]; then
            echo 'matrix=["envio","envio-rpc","ponder","rindexer","subgraph","subquery","sqd"]' >> "$GITHUB_OUTPUT"
          else
            MATRIX=$(echo "$INDEXERS" | tr ' ' '\n' | jq -R . | jq -sc .)
            echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          fi
          CASES="${{ inputs.cases }}"
          if [ -z "$CASES" ]; then
            echo 'cases=["erc20-account-balances","erc20-transfer-events"]' >> "$GITHUB_OUTPUT"
          else
            CASES_JSON=$(echo "$CASES" | tr ' ' '\n' | jq -R . | jq -sc .)
            echo "cases=$CASES_JSON" >> "$GITHUB_OUTPUT"
          fi
          DURATION="${{ inputs.duration }}"
          echo "duration=${DURATION:-60}" >> "$GITHUB_OUTPUT"

  # The harness has two test scripts — scripts/test-verification.ts and
  # scripts/test-tables.ts — that are run locally when either the verification
  # layer or the result table changes. They are deliberately not a CI job: the
  # verification test needs a live HyperSync token, which forks do not have.

  benchmark:
    name: "Benchmark: ${{ matrix.case }} / ${{ matrix.indexer }}"
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Runs third-party indexer binaries, so it gets the narrowest token that
    # still works: read-only, and enough to resolve a public release tag.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # Jobs run concurrently. GitHub gives each matrix job its own runner VM,
      # so compute (CPU/RAM/Postgres/Docker) is isolated already, and the shared
      # Envio endpoint is not rate limited, so concurrent jobs do not compete
      # for it. Wall-clock time is the slowest single job rather than the sum.
      matrix:
        case: ${{ fromJSON(needs.setup.outputs.cases) }}
        indexer: ${{ fromJSON(needs.setup.outputs.matrix) }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testing
          POSTGRES_DB: envio-dev
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # The Graph Node binary is a ~107 MB download. It is pinned to a release
      # tag in the driver, so the cache key only has to change when that does.
      - name: Cache Graph Node binary
        if: matrix.indexer == 'subgraph'
        uses: actions/cache@v4
        with:
          path: cases/${{ matrix.case }}/subgraph/bin
          # Keyed per case as well as per driver revision: both cases install
          # the same binary into their own directory, and a shared key would
          # have the second job to finish fail to save what the first already
          # wrote under that name.
          key: gnd-${{ matrix.case }}-${{ hashFiles('cases/lib/drivers/subgraph.ts') }}

      # The rust rindexer project pulls in alloy and the rindexer crate, which
      # is several minutes of compilation from cold. It happens before the
      # timer starts, so it costs CI wall clock rather than benchmark
      # accuracy — the cache keeps that cost off most runs.
      - name: Cache cargo build
        if: matrix.indexer == 'rindexer'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cases/${{ matrix.case }}/rindexer/target
          key: cargo-${{ matrix.case }}-${{ hashFiles(format('cases/{0}/rindexer/Cargo.toml', matrix.case)) }}
          restore-keys: cargo-${{ matrix.case }}-

      - name: Prepare services
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          INDEXER="${{ matrix.indexer }}"
          CASE_DIR="cases/${{ matrix.case }}"

          # Pre-pull Docker images so pulls don't count toward benchmark time
          case "$INDEXER" in
            ponder)
              docker pull postgres:17-alpine
              ;;
            rindexer)
              docker compose -f "$CASE_DIR/rindexer/docker-compose.yml" pull
              # A rust project is a crate of its own and runs its own binary,
              # so it is compiled here rather than installing the CLI. The
              # build is outside the benchmark timer either way.
              if [ -f "$CASE_DIR/rindexer/Cargo.toml" ]; then
                rustup update stable
                rustup default stable
                cargo build --release --manifest-path "$CASE_DIR/rindexer/Cargo.toml"
              else
                # install.sh resolves "latest" via an UNAUTHENTICATED GitHub API
                # call (60 req/h, shared across Actions runners) and does not guard
                # an empty result: when throttled the version is blank and the
                # download URL 404s (".../releases/download/v/..."), failing the job
                # and silently dropping rindexer from the table. Resolve the tag
                # ourselves with an authenticated call (5000 req/h) and pin it via
                # --version, which still tracks the latest release.
                RINDEXER_VERSION=""
                for i in 1 2 3; do
                  RINDEXER_VERSION=$(curl -fsSL \
                    -H "Authorization: Bearer $GITHUB_TOKEN" \
                    -H "Accept: application/vnd.github+json" \
                    https://api.github.com/repos/joshstevens19/rindexer/releases/latest \
                    | jq -r '.tag_name // empty' | sed 's/^v//') || true
                  [ -n "$RINDEXER_VERSION" ] && break
                  echo "rindexer version lookup attempt $i failed; retrying..." >&2
                  sleep $((i * 5))
                done
                if [ -z "$RINDEXER_VERSION" ]; then
                  echo "Failed to resolve latest rindexer version" >&2
                  exit 1
                fi
                echo "Installing rindexer v$RINDEXER_VERSION"
                curl -L https://rindexer.xyz/install.sh | bash -s -- --version "$RINDEXER_VERSION"
              fi
              ;;
            subgraph)
              docker pull postgres:17-alpine
              ;;
            subquery)
              docker compose -f "$CASE_DIR/subquery/docker-compose.yml" pull
              docker compose -f "$CASE_DIR/subquery/docker-compose.yml" build
              ;;
            sqd)
              docker compose -f "$CASE_DIR/sqd/docker-compose.yml" pull
              ;;
          esac

      - name: Run benchmark
        run: |
          set -o pipefail
          node cases/${{ matrix.case }}/run.ts ${{ matrix.indexer }} --duration="${{ needs.setup.outputs.duration }}" 2>&1 | tee /tmp/benchmark-output.txt
        env:
          ENVIO_API_TOKEN: ${{ secrets.ENVIO_API_TOKEN }}
          # Sqd's archive (v2.archive.subsquid.io) requires an API key as of
          # 19 May 2026. The @subsquid archive client reads it from SQD_API_KEY.
          # Get a key at https://portal.sqd.dev and add it as the SQD_API_KEY
          # repo secret. Without it, the sqd jobs report 0 (CREDENTIALS_INVALID).
          SQD_API_KEY: ${{ secrets.SQD_API_KEY }}

      - name: Post results to job summary
        if: always()
        run: |
          echo "## ${{ matrix.case }} / ${{ matrix.indexer }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/benchmark-output.txt 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || echo "No output captured" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ matrix.case }}--${{ matrix.indexer }}
          path: /tmp/benchmark-output.txt
          if-no-files-found: ignore

  summary:
    name: Summary
    needs: [setup, benchmark]
    if: always() && needs.setup.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all results
        uses: actions/download-artifact@v4
        with:
          path: results
          pattern: benchmark-*

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build comparison tables
        env:
          CASES: ${{ needs.setup.outputs.cases }}
        run: node scripts/build-tables.ts

      - name: Comment results on PR
        if: github.event_name == 'pull_request' && !cancelled()
        uses: actions/github-script@v7
        env:
          CASES: ${{ needs.setup.outputs.cases }}
        with:
          script: |
            const fs = require('fs');

            const cases = JSON.parse(process.env.CASES);
            // Scenario names come from each case config via build-tables.ts, so
            // the comment matches the README; the slug is the fallback.
            const titleOf = c => {
              const file = `/tmp/benchmark-title-${c}.txt`;
              if (fs.existsSync(file)) return fs.readFileSync(file, 'utf8').trim();
              return c.split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
            };

            const sections = [];
            for (const benchCase of cases) {
              const file = `/tmp/benchmark-table-${benchCase}.md`;
              const table = fs.existsSync(file)
                ? fs.readFileSync(file, 'utf8')
                : '_No results collected._';
              sections.push(`### ${titleOf(benchCase)}\n\n${table}`);
            }

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const body = [
              '## Benchmark Results',
              '',
              sections.join('\n\n'),
              '',
              `[Full output](${runUrl}) is available in the workflow run logs.`,
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      - name: Update README
        if: github.event_name == 'push'
        env:
          CASES: ${{ needs.setup.outputs.cases }}
        run: |
          CHANGED=0
          for CASE in $(echo "$CASES" | jq -r '.[]'); do
            TABLE="/tmp/benchmark-table-${CASE}.md"
            [ -f "$TABLE" ] || continue

            # Replace content between this case's markers with the new table
            awk -v start="<!-- BENCHMARK:${CASE}:START -->" \
                -v end="<!-- BENCHMARK:${CASE}:END -->" \
                -v tablefile="$TABLE" '
              $0 ~ start { print; while ((getline line < tablefile) > 0) print line; skip=1; next }
              $0 ~ end { skip=0 }
              !skip { print }
            ' README.md > README.tmp && mv README.tmp README.md
            CHANGED=1
          done

          [ "$CHANGED" = "1" ] || exit 0
          git diff --quiet README.md && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update benchmark results in README"
          git push
