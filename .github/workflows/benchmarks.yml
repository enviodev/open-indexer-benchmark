name: Run Benchmarks

on:
  workflow_dispatch:
    inputs:
      indexers:
        description: 'Indexers to benchmark (space-separated). Leave empty for all.'
        required: false
        default: ''
        type: string
      cases:
        description: 'Cases to benchmark (space-separated). Leave empty for all.'
        required: false
        default: ''
        type: string
      duration:
        description: 'Benchmark duration in seconds'
        required: false
        default: '100'
        type: string
  push:
    branches: [main]
  pull_request:

jobs:
  setup:
    name: Setup matrix
    runs-on: ubuntu-latest
    # Reads the diff to scope pull request runs; touches nothing else.
    permissions:
      contents: read
    outputs:
      cases: ${{ steps.set-matrix.outputs.cases }}
      case1: ${{ steps.set-matrix.outputs.case1 }}
      case2: ${{ steps.set-matrix.outputs.case2 }}
      indexers1: ${{ steps.set-matrix.outputs.indexers1 }}
      indexers2: ${{ steps.set-matrix.outputs.indexers2 }}
      partial: ${{ steps.set-matrix.outputs.partial }}
      duration: ${{ steps.set-matrix.outputs.duration }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The pull request scope comes from `git diff` against the base
          # commit, which a shallow clone does not have.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - id: set-matrix
        # Dispatch inputs are read from the environment rather than expanded
        # into the script text, so they reach the shell as data.
        env:
          INDEXERS: ${{ inputs.indexers }}
          CASES: ${{ inputs.cases }}
          DURATION_INPUT: ${{ inputs.duration }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$INDEXERS" ]; then
            INDEXERS_JSON='["envio","envio-rpc","ponder","rindexer","subgraph","subquery","sqd"]'
          else
            INDEXERS_JSON=$(echo "$INDEXERS" | tr ' ' '\n' | grep -v '^$' | jq -R . | jq -sc .)
          fi
          if [ -z "$CASES" ]; then
            CASES_JSON='["erc20-account-balances","erc20-transfer-events"]'
          else
            CASES_JSON=$(echo "$CASES" | tr ' ' '\n' | grep -v '^$' | jq -R . | jq -sc .)
          fi

          COUNT=$(echo "$CASES_JSON" | jq 'length')

          # An input of nothing but separators splits into no scenarios at all.
          # Left alone every scenario job would skip and the summary would still
          # publish an empty table, which reads as "measured, found nothing".
          if [ "$COUNT" -eq 0 ]; then
            echo "No scenarios resolved from the cases input." >&2
            exit 1
          fi

          # Scenarios run one after another, which needs one `needs`-chained job
          # per scenario below — GitHub cannot order a matrix. That makes the
          # number of scenario slots fixed: adding a third scenario means adding
          # a third `scenario-N` job here. Fail loudly rather than silently
          # dropping the extra scenario from the run and from the table.
          if [ "$COUNT" -gt 2 ]; then
            echo "Only 2 scenarios can run per workflow run; add a scenario-N job to benchmarks.yml." >&2
            exit 1
          fi

          # Every scenario measures every indexer, unless a pull request
          # narrows it: there a full run is fourteen long jobs against shared
          # data endpoints, nearly all of them re-measuring untouched code.
          # `main` and manual runs stay full — they publish the README table,
          # which has to hold a complete set of results.
          INDEXERS1="$INDEXERS_JSON"
          INDEXERS2="$INDEXERS_JSON"
          PARTIAL=0

          if [ "$EVENT_NAME" = "pull_request" ]; then
            # The filter has no execution path other than right here, so it
            # vouches for itself before it decides anything.
            node scripts/test-scope.ts

            # HEAD is the merge commit GitHub built against the base. The
            # event's base sha can lag the merge base it actually used, in
            # which case files from the base branch leak into the diff — that
            # only ever widens the selection, never narrows it.
            CHANGED_FILES=$(git diff --name-only "$BASE_SHA" HEAD)
            echo "Changed files:"
            echo "$CHANGED_FILES" | sed 's/^/  /'

            SCOPE=$(CHANGED_FILES="$CHANGED_FILES" ALL_CASES="$CASES_JSON" \
              ALL_INDEXERS="$INDEXERS_JSON" node scripts/select-scope.ts)
            echo "Scope: $SCOPE"

            CASES_JSON=$(echo "$SCOPE" | jq -c '.cases')
            [ "$(echo "$SCOPE" | jq '.full')" = "true" ] || PARTIAL=1

            if [ "$CASES_JSON" = "[]" ]; then
              echo "Nothing benchmark-related changed; skipping the benchmark run."
            fi
          fi

          CASE1=$(echo "$CASES_JSON" | jq -r '.[0] // ""')
          CASE2=$(echo "$CASES_JSON" | jq -r '.[1] // ""')
          if [ "$EVENT_NAME" = "pull_request" ]; then
            INDEXERS1=$(echo "$SCOPE" | jq -c --arg c "$CASE1" '.indexers[$c] // []')
            INDEXERS2=$(echo "$SCOPE" | jq -c --arg c "$CASE2" '.indexers[$c] // []')
          fi

          echo "cases=$CASES_JSON" >> "$GITHUB_OUTPUT"
          echo "case1=$CASE1" >> "$GITHUB_OUTPUT"
          echo "case2=$CASE2" >> "$GITHUB_OUTPUT"
          echo "indexers1=$INDEXERS1" >> "$GITHUB_OUTPUT"
          echo "indexers2=$INDEXERS2" >> "$GITHUB_OUTPUT"
          echo "partial=$PARTIAL" >> "$GITHUB_OUTPUT"

          echo "duration=${DURATION_INPUT:-100}" >> "$GITHUB_OUTPUT"

  # The harness has three test scripts — scripts/test-verification.ts,
  # scripts/test-tables.ts and scripts/test-scope.ts — that are run locally when
  # the verification layer, the result table or the pull request run filter
  # changes. They are deliberately not a CI job: the verification test needs a
  # live HyperSync token, which forks do not have. The one exception is
  # test-scope.ts, which the setup job runs before trusting the filter's
  # decision, since it needs no credentials and takes under a second.

  # One scenario at a time: every indexer of scenario 1 runs in parallel, and
  # scenario 2 only starts once they have all finished. Keeping the scenarios
  # apart halves how many indexers hit the shared data endpoints at once, so a
  # scenario's numbers are not shaped by what the other scenario was doing.
  scenario-1:
    name: ${{ needs.setup.outputs.case1 }}
    needs: setup
    if: needs.setup.outputs.case1 != ''
    uses: ./.github/workflows/benchmark-case.yml
    with:
      case: ${{ needs.setup.outputs.case1 }}
      indexers: ${{ needs.setup.outputs.indexers1 }}
      duration: ${{ needs.setup.outputs.duration }}
    secrets: inherit

  scenario-2:
    name: ${{ needs.setup.outputs.case2 }}
    needs: [setup, scenario-1]
    # `always()` so a failing indexer in scenario 1 — which is a result in its
    # own right, not a reason to skip the rest of the run — still lets scenario
    # 2 start once scenario 1 is done.
    if: always() && needs.setup.result == 'success' && needs.setup.outputs.case2 != ''
    uses: ./.github/workflows/benchmark-case.yml
    with:
      case: ${{ needs.setup.outputs.case2 }}
      indexers: ${{ needs.setup.outputs.indexers2 }}
      duration: ${{ needs.setup.outputs.duration }}
    secrets: inherit

  summary:
    name: Summary
    needs: [setup, scenario-1, scenario-2]
    # A pull request that changed nothing benchmark-related runs no scenario,
    # so there is nothing to tabulate — and an empty table reads as "measured,
    # found nothing" rather than "not measured".
    if: always() && needs.setup.result == 'success' && needs.setup.outputs.case1 != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all results
        uses: actions/download-artifact@v4
        with:
          path: results
          pattern: benchmark-*

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build comparison tables
        env:
          CASES: ${{ needs.setup.outputs.cases }}
          PARTIAL_RUN: ${{ needs.setup.outputs.partial }}
        run: node scripts/build-tables.ts

      - name: Comment results on PR
        if: github.event_name == 'pull_request' && !cancelled()
        uses: actions/github-script@v7
        env:
          CASES: ${{ needs.setup.outputs.cases }}
          PARTIAL_RUN: ${{ needs.setup.outputs.partial }}
        with:
          script: |
            const fs = require('fs');

            const cases = JSON.parse(process.env.CASES);
            // Scenario names come from each case config via build-tables.ts, so
            // the comment matches the README; the slug is the fallback.
            const titleOf = c => {
              const file = `/tmp/benchmark-title-${c}.txt`;
              if (fs.existsSync(file)) return fs.readFileSync(file, 'utf8').trim();
              return c.split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
            };

            const sections = [];
            for (const benchCase of cases) {
              const file = `/tmp/benchmark-table-${benchCase}.md`;
              const table = fs.existsSync(file)
                ? fs.readFileSync(file, 'utf8')
                : '_No results collected._';
              sections.push(`### ${titleOf(benchCase)}\n\n${table}`);
            }

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            // Say so when the run was narrowed, so a ⚠️ row reads as "not
            // re-run by this pull request" rather than "this indexer broke".
            const scopeNote = process.env.PARTIAL_RUN === '1'
              ? 'Only the scenarios and indexers this pull request touches were re-run; '
                + 'the remaining rows are carried forward from the last published results.'
              : '';

            const body = [
              '## Benchmark Results',
              '',
              ...(scopeNote ? [scopeNote, ''] : []),
              sections.join('\n\n'),
              '',
              `[Full output](${runUrl}) is available in the workflow run logs.`,
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      - name: Update README
        if: github.event_name == 'push'
        env:
          CASES: ${{ needs.setup.outputs.cases }}
        run: |
          CHANGED=0
          for CASE in $(echo "$CASES" | jq -r '.[]'); do
            TABLE="/tmp/benchmark-table-${CASE}.md"
            [ -f "$TABLE" ] || continue

            # Replace content between this case's markers with the new table
            awk -v start="<!-- BENCHMARK:${CASE}:START -->" \
                -v end="<!-- BENCHMARK:${CASE}:END -->" \
                -v tablefile="$TABLE" '
              $0 ~ start { print; while ((getline line < tablefile) > 0) print line; skip=1; next }
              $0 ~ end { skip=0 }
              !skip { print }
            ' README.md > README.tmp && mv README.tmp README.md
            CHANGED=1
          done

          [ "$CHANGED" = "1" ] || exit 0
          git diff --quiet README.md && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update benchmark results in README"
          git push
