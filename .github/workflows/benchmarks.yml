name: Run Benchmarks

on:
  workflow_dispatch:
    inputs:
      indexers:
        description: 'Indexers to benchmark (space-separated). Leave empty for all.'
        required: false
        default: ''
        type: string
      cases:
        description: 'Cases to benchmark (space-separated). Leave empty for all.'
        required: false
        default: ''
        type: string
      duration:
        description: 'Benchmark duration in seconds'
        required: false
        default: '100'
        type: string
  push:
    branches: [main]
  pull_request:

jobs:
  setup:
    name: Setup matrix
    runs-on: ubuntu-latest
    # Only echoes the matrix to GITHUB_OUTPUT; touches neither repo nor API.
    permissions: {}
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      cases: ${{ steps.set-matrix.outputs.cases }}
      case1: ${{ steps.set-matrix.outputs.case1 }}
      case2: ${{ steps.set-matrix.outputs.case2 }}
      case3: ${{ steps.set-matrix.outputs.case3 }}
      duration: ${{ steps.set-matrix.outputs.duration }}
    steps:
      - id: set-matrix
        # Dispatch inputs are read from the environment rather than expanded
        # into the script text, so they reach the shell as data.
        env:
          INDEXERS: ${{ inputs.indexers }}
          CASES: ${{ inputs.cases }}
          DURATION_INPUT: ${{ inputs.duration }}
        run: |
          if [ -z "$INDEXERS" ]; then
            echo 'matrix=["envio","envio-rpc","ponder","rindexer","subgraph","subquery","sqd"]' >> "$GITHUB_OUTPUT"
          else
            MATRIX=$(echo "$INDEXERS" | tr ' ' '\n' | grep -v '^$' | jq -R . | jq -sc .)
            echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          fi
          if [ -z "$CASES" ]; then
            CASES_JSON='["erc20-account-balances","erc20-transfer-events","safe-factory-registrations"]'
          else
            CASES_JSON=$(echo "$CASES" | tr ' ' '\n' | grep -v '^$' | jq -R . | jq -sc .)
          fi
          echo "cases=$CASES_JSON" >> "$GITHUB_OUTPUT"

          COUNT=$(echo "$CASES_JSON" | jq 'length')

          # An input of nothing but separators splits into no scenarios at all.
          # Left alone every scenario job would skip and the summary would still
          # publish an empty table, which reads as "measured, found nothing".
          if [ "$COUNT" -eq 0 ]; then
            echo "No scenarios resolved from the cases input." >&2
            exit 1
          fi

          # Scenarios run one after another, which needs one `needs`-chained job
          # per scenario below — GitHub cannot order a matrix. That makes the
          # number of scenario slots fixed: adding a fourth scenario means adding
          # a fourth `scenario-N` job here. Fail loudly rather than silently
          # dropping the extra scenario from the run and from the table.
          if [ "$COUNT" -gt 3 ]; then
            echo "Only 3 scenarios can run per workflow run; add a scenario-N job to benchmarks.yml." >&2
            exit 1
          fi
          echo "case1=$(echo "$CASES_JSON" | jq -r '.[0] // ""')" >> "$GITHUB_OUTPUT"
          echo "case2=$(echo "$CASES_JSON" | jq -r '.[1] // ""')" >> "$GITHUB_OUTPUT"
          echo "case3=$(echo "$CASES_JSON" | jq -r '.[2] // ""')" >> "$GITHUB_OUTPUT"

          echo "duration=${DURATION_INPUT:-100}" >> "$GITHUB_OUTPUT"

  # The harness has two test scripts — scripts/test-verification.ts and
  # scripts/test-tables.ts — that are run locally when either the verification
  # layer or the result table changes. They are deliberately not a CI job: the
  # verification test needs a live HyperSync token, which forks do not have.

  # One scenario at a time: every indexer of scenario 1 runs in parallel, and
  # scenario 2 only starts once they have all finished. Keeping the scenarios
  # apart halves how many indexers hit the shared data endpoints at once, so a
  # scenario's numbers are not shaped by what the other scenario was doing.
  scenario-1:
    name: ${{ needs.setup.outputs.case1 }}
    needs: setup
    if: needs.setup.outputs.case1 != ''
    uses: ./.github/workflows/benchmark-case.yml
    with:
      case: ${{ needs.setup.outputs.case1 }}
      indexers: ${{ needs.setup.outputs.matrix }}
      duration: ${{ needs.setup.outputs.duration }}
    secrets: inherit

  scenario-2:
    name: ${{ needs.setup.outputs.case2 }}
    needs: [setup, scenario-1]
    # `always()` so a failing indexer in scenario 1 — which is a result in its
    # own right, not a reason to skip the rest of the run — still lets scenario
    # 2 start once scenario 1 is done.
    if: always() && needs.setup.result == 'success' && needs.setup.outputs.case2 != ''
    uses: ./.github/workflows/benchmark-case.yml
    with:
      case: ${{ needs.setup.outputs.case2 }}
      indexers: ${{ needs.setup.outputs.matrix }}
      duration: ${{ needs.setup.outputs.duration }}
    secrets: inherit

  scenario-3:
    name: ${{ needs.setup.outputs.case3 }}
    needs: [setup, scenario-1, scenario-2]
    if: always() && needs.setup.result == 'success' && needs.setup.outputs.case3 != ''
    uses: ./.github/workflows/benchmark-case.yml
    with:
      case: ${{ needs.setup.outputs.case3 }}
      indexers: ${{ needs.setup.outputs.matrix }}
      duration: ${{ needs.setup.outputs.duration }}
    secrets: inherit

  summary:
    name: Summary
    needs: [setup, scenario-1, scenario-2, scenario-3]
    if: always() && needs.setup.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all results
        uses: actions/download-artifact@v4
        with:
          path: results
          pattern: benchmark-*

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build comparison tables
        env:
          CASES: ${{ needs.setup.outputs.cases }}
        run: node scripts/build-tables.ts

      - name: Comment results on PR
        if: github.event_name == 'pull_request' && !cancelled()
        uses: actions/github-script@v7
        env:
          CASES: ${{ needs.setup.outputs.cases }}
        with:
          script: |
            const fs = require('fs');

            const cases = JSON.parse(process.env.CASES);
            // Scenario names come from each case config via build-tables.ts, so
            // the comment matches the README; the slug is the fallback.
            const titleOf = c => {
              const file = `/tmp/benchmark-title-${c}.txt`;
              if (fs.existsSync(file)) return fs.readFileSync(file, 'utf8').trim();
              return c.split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
            };

            const sections = [];
            for (const benchCase of cases) {
              const file = `/tmp/benchmark-table-${benchCase}.md`;
              const table = fs.existsSync(file)
                ? fs.readFileSync(file, 'utf8')
                : '_No results collected._';
              sections.push(`### ${titleOf(benchCase)}\n\n${table}`);
            }

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const body = [
              '## Benchmark Results',
              '',
              sections.join('\n\n'),
              '',
              `[Full output](${runUrl}) is available in the workflow run logs.`,
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      - name: Update README
        if: github.event_name == 'push'
        env:
          CASES: ${{ needs.setup.outputs.cases }}
        run: |
          CHANGED=0
          for CASE in $(echo "$CASES" | jq -r '.[]'); do
            TABLE="/tmp/benchmark-table-${CASE}.md"
            [ -f "$TABLE" ] || continue

            # Replace content between this case's markers with the new table
            awk -v start="<!-- BENCHMARK:${CASE}:START -->" \
                -v end="<!-- BENCHMARK:${CASE}:END -->" \
                -v tablefile="$TABLE" '
              $0 ~ start { print; while ((getline line < tablefile) > 0) print line; skip=1; next }
              $0 ~ end { skip=0 }
              !skip { print }
            ' README.md > README.tmp && mv README.tmp README.md
            CHANGED=1
          done

          [ "$CHANGED" = "1" ] || exit 0
          git diff --quiet README.md && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update benchmark results in README"
          git push
