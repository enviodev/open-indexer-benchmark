# Temporary: prints the rust typings `rindexer codegen` generates for the
# account-balances config, so the rust handlers can be written against the real
# generated API rather than guessed. Delete once the rust implementation lands.
name: Scaffold rindexer rust project

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/rindexer-scaffold.yml

jobs:
  scaffold:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install rindexer
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(curl -fsSL \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/joshstevens19/rindexer/releases/latest \
            | jq -r '.tag_name // empty' | sed 's/^v//')
          echo "rindexer version: $VERSION"
          curl -L https://rindexer.xyz/install.sh | bash -s -- --version "$VERSION"
          echo "$HOME/.config/.rindexer/bin" >> "$GITHUB_PATH"

      - name: Print the CLI surface
        run: |
          for cmd in "" "new" "new rust" "codegen"; do
            echo "───────── rindexer $cmd --help ─────────"
            rindexer $cmd --help < /dev/null 2>&1 | head -c 4000
          done

      # `rindexer new rust` prompts for project details and, with no TTY, loops
      # re-printing the prompt — so it gets canned answers, a timeout, and a
      # capped log. What matters here is the shape of the crate it lays down:
      # Cargo.toml, main.rs, and where the generated modules land.
      - name: Scaffold a stock rust project
        run: |
          mkdir -p /tmp/stock
          printf 'erc20-indexer\nbenchmark\n1\n\n\n\n\n\n\n\n' \
            | timeout 60 rindexer new -p /tmp/stock rust 2>&1 | head -c 4000 || true
          echo "===== TREE ====="
          find /tmp/stock -type f -not -path '*/target/*' | sort | head -50
          for f in $(find /tmp/stock -name '*.rs' -o -name 'Cargo.toml' -o -name 'rindexer.yaml' | sort); do
            echo "───────── $f ─────────"
            head -c 8000 "$f"
            echo
          done

      - name: Generate typings for the account-balances config
        run: |
          set -x
          mkdir -p /tmp/scaffold
          cp -r cases/erc20-account-balances/rindexer/. /tmp/scaffold/
          cd /tmp/scaffold
          # codegen runs `cargo fmt`, which needs to be inside a crate. A stub
          # manifest is enough — formatting only cares about syntax, and the
          # real dependency set comes from the stock scaffold above.
          printf '[package]\nname = "erc20-indexer"\nversion = "0.1.0"\nedition = "2021"\n\n[dependencies]\n' > Cargo.toml
          mkdir -p src
          echo 'fn main() {}' > src/main.rs
          sed -i 's/^project_type: no-code/project_type: rust/' rindexer.yaml
          # A rust project rejects `tables:` outright — declarative table
          # operations are a no-code-only feature, and the aggregation moves
          # into handler code instead.
          sed -i '/^    tables:/,/^graphql:/{/^graphql:/!d}' rindexer.yaml
          cat rindexer.yaml

          export RINDEXER_END_BLOCK=18600100
          export ETHEREUM_RPC="https://ethereum-rpc.publicnode.com"
          export DATABASE_URL="postgresql://postgres:postgres@localhost:5432/postgres"
          timeout 180 rindexer codegen typings < /dev/null
          timeout 180 rindexer codegen indexer < /dev/null

      - name: Print what was generated
        if: always()
        run: |
          cd /tmp/scaffold
          echo "===== TREE ====="
          find . -type f -not -path './abis/*' | sort
          echo "===== SOURCES ====="
          # Bounded so an unexpected file cannot flood the log again.
          for f in $(find . -name '*.rs' -o -name 'Cargo.toml' | sort); do
            echo "───────── $f ─────────"
            head -c 20000 "$f"
            echo
          done
