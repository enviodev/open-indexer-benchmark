# A data source takes one address, so the case's eight tokens are eight data
# sources over the same mapping, ABI and entities.
#
# The `calls:` block under the handler is what makes this case survivable on
# Graph Node: a declared `eth_call` is fetched before the handler runs, and all
# of a block's declared calls are fetched at once, so the mapping's own
# `allowance` call is answered from what was already prefetched instead of
# blocking the single-threaded handler for a round trip. It is declared
# unconditionally, so the roughly one approval in five that revokes — and needs
# no call — is prefetched anyway; the manifest has no way to say "only when the
# value is non-zero".
specVersion: 1.3.0
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: USDT
    network: mainnet
    source:
      address: "0xdac17f958d2ee523a2206206994597c13d831ec7"
      abi: ERC20
      startBlock: __START_BLOCK__
      endBlock: __END_BLOCK__
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - ApprovalEvent
        - TokenAllowance
      abis:
        - name: ERC20
          file: ./abis/ERC20.json
      eventHandlers:
        - event: Approval(indexed address,indexed address,uint256)
          handler: handleApproval
          calls:
            allowance: ERC20[event.address].allowance(event.params.owner, event.params.spender)
      file: ./src/mapping.ts
