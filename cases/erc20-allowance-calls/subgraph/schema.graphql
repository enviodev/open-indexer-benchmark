# Approval events are written once and never updated, so they are declared
# immutable — the storage layout The Graph's docs recommend for event data. The
# allowance table is one row per (token, owner, spender), rewritten every time
# that pair approves again, so it stays mutable.
type ApprovalEvent @entity(immutable: true) {
  id: ID!
  token: String!
  owner: String!
  spender: String!
  approved: BigInt!
  allowance: BigInt!
  timestamp: Int!
}

type TokenAllowance @entity(immutable: false) {
  id: ID!
  token: String!
  owner: String!
  spender: String!
  allowance: BigInt!
}
