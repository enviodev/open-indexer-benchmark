# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
name: erc20-allowance-indexer
description: ERC-20 approvals, with the resulting allowance read back from the chain
# A batch is the unit of concurrency for the Effect API: the preload pass puts
# the whole batch's calls in flight at once, so how many an indexer has
# outstanding is set by how many events it processes at a time. At the default
# 5,000 that is about 4,100 calls — the ~82% of approvals that are not
# revocations — and the run spends its time at a concurrency the endpoint could
# answer several times over.
#
# Measured on the verification range and two 60s windows, holding everything
# else fixed: 5,000 → 8,188 events/s at 3,921 calls in flight; 20,000 → 10,890
# at 15,473; 50,000 → 9,503 at 38,000. It turns over past 20,000, where the
# batch costs more in storage writes and memory than the extra concurrency is
# worth, so 20,000 is where this sits.
full_batch_size: 20000
contracts:
  - name: ERC20
    events:
      - event: "Approval(address indexed owner, address indexed spender, uint256 value)"
chains:
  - id: 1 # Ethereum Mainnet
    start_block: 25600000
    end_block: ${ENVIO_END_BLOCK}
    rpc:
      url: ${ENVIO_RPC_URL}
      for: ${ENVIO_RPC_FOR:-fallback}
    contracts:
      - name: ERC20
        address:
          - 0xdac17f958d2ee523a2206206994597c13d831ec7 # USDT
          - 0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48 # USDC
          - 0x68749665ff8d2d112fa859aa293f07a622782f38 # XAUt
          - 0xc02aaa39b223fe8d0a0e5c4f27ead9083c756cc2 # WETH
          - 0x4c9edd5852cd905f086c759e8383e09bff1e68b3 # USDe
          - 0x2260fac5e5542a773aa44fbcfedf7c193bc2c599 # WBTC
          - 0x6b175474e89094c44da98b954eedeac495271d0f # DAI
          - 0xf939e0a03fb07f59a73314e73794be0e57ac1b4e # crvUSD
