[package]
name = "substreams-solana-spl-transfers"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
prost = "0.11"
prost-types = "0.11"
spl-token = "6.0"
bs58 = "0.5"
substreams = "0.5"
