syntax = "proto3";
package spl.transfers.v1;

// One row per SPL Token transfer of the tracked mint, shaped the way every
// other implementation of this scenario writes it.
message Transfers {
  repeated Transfer data = 1;
}

message Transfer {
  string id = 1;
  string amount = 2;
  string source = 3;
  string destination = 4;
  string signer = 5;
  string tx_signature = 6;
  bool checked = 7;
  uint64 slot = 8;
  int64 timestamp = 9;
}
