# yaml-language-server: $schema=./node_modules/envio/svm.schema.json
name: spl-token-transfers
description: SPL Token transfers of a single mint
ecosystem: svm
chains:
  - id: solana
    start_slot: 440000000
    end_slot: ${ENVIO_END_BLOCK:-440003999}
programs:
  - name: SplToken
    program_id: TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA
    # SPL Token's published Codama IDL, vendored so a run is reproducible.
    # `transferChecked` names the mint it moves; `transfer` does not, which is
    # what the handler has to work around.
    idl: ./token.idl.json
