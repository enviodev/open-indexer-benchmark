name: rindexer-safe-factory-benchmark

volumes:
  rindexer_safe_factory_pgdata:
    driver: local

services:
  postgresql:
    container_name: rindexer-safe-factory-postgres
    image: postgres:18
    shm_size: 1g
    restart: always
    volumes:
      - rindexer_safe_factory_pgdata:/var/lib/postgresql
    ports:
      - 5440:5432
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rindexer}
