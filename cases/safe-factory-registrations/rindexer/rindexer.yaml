            - "0x4e1dcf7ad4e460cfd30791ccc4f9c8a4f820ec67"
            - "0x14f2982d601c9458f93bd70b218933a6f8165e7b"
          abi: ./abis/SafeProxyFactoryModern.abi.json
          event_name: ProxyCreation
          input_name: "proxy"
        start_block: "24600000"
        end_block: "${RINDEXER_END_BLOCK}"
    abi: ./abis/SafeDualModern.abi.json
    include_events:
      - ExecutionSuccess
      - ExecutionFailure
      - ChangedMasterCopy
      - ChangedFallbackHandler
      - ChangedGuard
      - ChangedModuleGuard
      - EnabledModule
      - DisabledModule
      - AddedOwner
      - RemovedOwner

global:
  health_port: 8082
