name: safe-indexer
description: Safe proxy registrations from the four canonical factories, and the events their proxies emit
project_type: rust
timestamps: true

# Why eight contracts for one protocol:
#
# * The two factory generations decode `ProxyCreation` differently (the proxy
#   moved into a topic in 1.4.1), so child extraction needs one factory
#   definition per generation — the addresses within a generation share one.
# * Ten of the child events exist under one topic0 in two layouts (1.4.x made
#   the first argument indexed without changing the signature), and a proxy can
#   emit either at any time. Each layout is registered as its own contract; a
#   log decodes under exactly one of them, so together they capture everything
#   with no duplicates. The five events whose layout never changed live in a
#   single Common registration per generation.
#
# The handlers write one hand-owned table set (see src/), which is why
# `disable_create_tables` is on: the generated per-contract event tables would
# otherwise shadow the case's tables under the same names, empty.

networks:
  - name: ethereum
    chain_id: 1
    rpc: ${ETHEREUM_RPC}
    # The children number in the tens of thousands while their events are
    # rare, which is the workload the in-memory strategy exists for: fetch by
    # topic, filter by address on the client.
    get_logs_settings:
      address_filtering: in-memory

storage:
  postgres:
    enabled: true
    drop_each_run: true
    disable_create_tables: true

contracts:
  - name: FactoryV13
    details:
      - network: ethereum
        address:
          - "0xa6b71e26c5e0845f74c812102ca7114b6a896ab2" # 1.3.0 canonical
          - "0xc22834581ebc8527d974f8a1c97e1bea4ef910bc" # 1.3.0 eip155
        start_block: "24600000"
        end_block: "${RINDEXER_END_BLOCK}"
    abi: ./abis/SafeProxyFactory.abi.json
    include_events:
      - ProxyCreation

  - name: FactoryV14
    details:
      - network: ethereum
        address:
          - "0x4e1dcf7ad4e460cfd30791ccc4f9c8a4f820ec67" # 1.4.1 canonical
          - "0x14f2982d601c9458f93bd70b218933a6f8165e7b" # 1.5.0 canonical
        start_block: "24600000"
        end_block: "${RINDEXER_END_BLOCK}"
    abi: ./abis/SafeProxyFactoryModern.abi.json
    include_events:
      - ProxyCreation

  - name: ChildCommonV13
    details:
      - network: ethereum
        factory:
          name: FactoryV13Common
          address:
            - "0xa6b71e26c5e0845f74c812102ca7114b6a896ab2"
            - "0xc22834581ebc8527d974f8a1c97e1bea4ef910bc"
          abi: ./abis/SafeProxyFactory.abi.json
          event_name: ProxyCreation
          input_name: "proxy"
        start_block: "24600000"
        end_block: "${RINDEXER_END_BLOCK}"
    abi: ./abis/SafeCommon.abi.json
    include_events:
      - SafeSetup
      - SafeReceived
      - SafeModuleTransaction
      - SafeMultiSigTransaction
      - ChangedThreshold

  - name: ChildCommonV14
    details:
      - network: ethereum
        factory:
          name: FactoryV14Common
          address:
            - "0x4e1dcf7ad4e460cfd30791ccc4f9c8a4f820ec67"
            - "0x14f2982d601c9458f93bd70b218933a6f8165e7b"
          abi: ./abis/SafeProxyFactoryModern.abi.json
          event_name: ProxyCreation
          input_name: "proxy"
        start_block: "24600000"
        end_block: "${RINDEXER_END_BLOCK}"
    abi: ./abis/SafeCommon.abi.json
    include_events:
      - SafeSetup
      - SafeReceived
      - SafeModuleTransaction
      - SafeMultiSigTransaction
      - ChangedThreshold

  - name: ChildLegacyLayoutV13
    details:
      - network: ethereum
        factory:
          name: FactoryV13LegacyLayout
          address:
            - "0xa6b71e26c5e0845f74c812102ca7114b6a896ab2"
            - "0xc22834581ebc8527d974f8a1c97e1bea4ef910bc"
          abi: ./abis/SafeProxyFactory.abi.json
          event_name: ProxyCreation
          input_name: "proxy"
        start_block: "24600000"
        end_block: "${RINDEXER_END_BLOCK}"
    abi: ./abis/SafeDualLegacy.abi.json
    include_events:
      - ExecutionSuccess
      - ExecutionFailure
      - ChangedMasterCopy
      - ChangedFallbackHandler
      - ChangedGuard
      - ChangedModuleGuard
      - EnabledModule
      - DisabledModule
      - AddedOwner
      - RemovedOwner

  - name: ChildLegacyLayoutV14
    details:
      - network: ethereum
        factory:
          name: FactoryV14LegacyLayout
          address:
            - "0x4e1dcf7ad4e460cfd30791ccc4f9c8a4f820ec67"
            - "0x14f2982d601c9458f93bd70b218933a6f8165e7b"
          abi: ./abis/SafeProxyFactoryModern.abi.json
          event_name: ProxyCreation
          input_name: "proxy"
        start_block: "24600000"
        end_block: "${RINDEXER_END_BLOCK}"
    abi: ./abis/SafeDualLegacy.abi.json
    include_events:
      - ExecutionSuccess
      - ExecutionFailure
      - ChangedMasterCopy
      - ChangedFallbackHandler
      - ChangedGuard
      - ChangedModuleGuard
      - EnabledModule
      - DisabledModule
      - AddedOwner
      - RemovedOwner

  - name: ChildModernLayoutV13
    details:
      - network: ethereum
        factory:
          name: FactoryV13ModernLayout
          address:
            - "0xa6b71e26c5e0845f74c812102ca7114b6a896ab2"
            - "0xc22834581ebc8527d974f8a1c97e1bea4ef910bc"
          abi: ./abis/SafeProxyFactory.abi.json
          event_name: ProxyCreation
          input_name: "proxy"
        start_block: "24600000"
        end_block: "${RINDEXER_END_BLOCK}"
    abi: ./abis/SafeDualModern.abi.json
    include_events:
      - ExecutionSuccess
      - ExecutionFailure
      - ChangedMasterCopy
      - ChangedFallbackHandler
      - ChangedGuard
      - ChangedModuleGuard
      - EnabledModule
      - DisabledModule
      - AddedOwner
      - RemovedOwner

  - name: ChildModernLayoutV14
    details:
