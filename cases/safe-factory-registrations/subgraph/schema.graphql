# Both entities are written once and never updated, so they are declared
# immutable — the storage layout The Graph's docs recommend for event data.
type Safe @entity(immutable: true) {
  id: ID!
  address: String!
  singleton: String!
  timestamp: Int!
}

type SafeSetup @entity(immutable: true) {
  id: ID!
  safe: String!
  initiator: String!
  threshold: BigInt!
  timestamp: Int!
}

type SafeReceived @entity(immutable: true) {
  id: ID!
  safe: String!
  sender: String!
  value: BigInt!
  timestamp: Int!
}

type SafeModuleTransaction @entity(immutable: true) {
  id: ID!
  safe: String!
  module: String!
  to: String!
  value: BigInt!
  operation: Int!
  timestamp: Int!
}
