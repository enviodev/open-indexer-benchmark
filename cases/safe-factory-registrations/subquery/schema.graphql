type Safe @entity {
  id: ID!
  address: String!
  singleton: String!
  timestamp: Int!
}

type SafeSetup @entity {
  id: ID!
  safe: String!
  initiator: String!
  threshold: BigInt!
  timestamp: Int!
}

type SafeReceived @entity {
  id: ID!
  safe: String!
  sender: String!
  value: BigInt!
  timestamp: Int!
}

type SafeModuleTransaction @entity {
  id: ID!
  safe: String!
  module: String!
  to: String!
  value: BigInt!
  operation: Int!
  timestamp: Int!
}
