syntax = "proto3";
package evm.transfers.v1;

// One row per ERC-20 Transfer event, shaped the way every other implementation
// of this scenario writes it.
message TransferEvents {
  repeated TransferEvent data = 1;
}

message TransferEvent {
  string id = 1;
  string amount = 2;
  string from_address = 3;
  string to_address = 4;
  int64 block_timestamp = 5;
}
