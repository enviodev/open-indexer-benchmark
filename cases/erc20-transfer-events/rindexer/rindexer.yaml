name: erc20-indexer
description: Raw ERC-20 Transfer event indexer for USDC
project_type: no-code
timestamps: true

networks:
  - name: ethereum
    chain_id: 1
    rpc: ${ETHEREUM_RPC}

storage:
  postgres:
    enabled: true
    drop_each_run: true

contracts:
  - name: USDC
    details:
      - network: ethereum
        address: "0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48"
        start_block: "18600000"
    abi: ./abis/ERC20.abi.json
    include_events:
      - Transfer

graphql:
  port: 19876

global:
  health_port: 8082
