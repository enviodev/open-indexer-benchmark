name: erc20-indexer
description: Raw ERC-20 Transfer event indexer for USDC
project_type: no-code
timestamps: true

networks:
  - name: ethereum
    chain_id: 1
    rpc: ${ETHEREUM_RPC}
    # USDC is extremely log-dense, so an unbounded eth_getLogs range (the
    # default) returns far more than the provider will serve in one response
    # and rindexer stalls without indexing. Pin an explicit per-request block
    # range so each fetch stays within provider limits, and fan the historic
    # backfill across several concurrent workers for throughput.
    max_block_range: 1000
    fetch_concurrency: 10

storage:
  postgres:
    enabled: true
    drop_each_run: true

contracts:
  - name: USDC
    details:
      - network: ethereum
        address: "0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48"
        start_block: "18600000"
        end_block: "${RINDEXER_END_BLOCK}"
    abi: ./abis/ERC20.abi.json
    include_events:
      - Transfer

global:
  health_port: 8082
