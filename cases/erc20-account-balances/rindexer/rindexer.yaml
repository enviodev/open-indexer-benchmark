name: erc20-indexer
description: ERC-20 Transfer and Approval event indexer for RocketTokenRETH
project_type: rust
timestamps: true

networks:
  - name: ethereum
    chain_id: 1
    rpc: ${ETHEREUM_RPC}

storage:
  postgres:
    enabled: true
    drop_each_run: true

contracts:
  - name: RocketTokenRETH
    details:
      - network: ethereum
        address: "0xae78736cd615f374d3085123a210448e74fc6393"
        start_block: "18600000"
        end_block: "${RINDEXER_END_BLOCK}"
    abi: ./abis/ERC20.abi.json
    include_events:
      - Transfer
      - Approval

global:
  health_port: 8082
