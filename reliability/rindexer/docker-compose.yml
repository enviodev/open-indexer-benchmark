name: rindexer-reliability

volumes:
  rindexer_reliability_pgdata:
    driver: local

services:
  postgresql:
    image: postgres:18
    shm_size: 1g
    restart: always
    volumes:
      - rindexer_reliability_pgdata:/var/lib/postgresql
    ports:
      # The driver shifts the port, and the project name, for each copy of
      # this project the suite runs side by side; alone, both are as written.
      - ${RINDEXER_PG_PORT:-5440}:5432
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rindexer}
