name: reliability
description: The reliability case as a rust rindexer project, over a generated chain
project_type: rust
timestamps: true

networks:
  - name: ethereum
    # The generated chain answers as mainnet: several tools treat an unknown
    # chain id as a configuration error rather than as a chain.
    chain_id: 1
    rpc: ${ETHEREUM_RPC}
    # The reliability scenarios are only served over RPC, because the
    # benchmark cannot make HyperSync reorg or fail on demand. Written out
    # rather than substituted from RINDEXER_HYPERSYNC as the throughput
    # projects do: a rust project's data source is baked into its typings at
    # codegen, which reads this file without substituting anything.
    hypersync: false

storage:
  postgres:
    enabled: true
    # Each scenario run starts from an empty database: the harness prepares the
    # tool before every repeat, and a run that inherited the last one's rows
    # would compare the wrong thing against the chain.
    drop_each_run: true

contracts:
  - name: ERC20
    details:
      - network: ethereum
        address: "0x0000000000000000000000000000000000c0ffee"
        start_block: "1000000"
        # No end block. The suite is about what happens at the head, so this
        # follows it - and rindexer refuses to start at all when the end block
        # it is given is above the chain's current head, which the generated
        # chain's is by a million blocks at the moment a run begins.
    abi: ./abis/ERC20.abi.json
    include_events:
      - Transfer
      # The second event. Its handler stores it in the table rindexer derives
      # from the ABI - and a tool that is configured for two events and stores
      # one is exactly what this is here to catch.
      - MetadataUpdated
    # The running balance and the token row are written by the Transfer
    # handler in src/rindexer_lib/indexers/reliability/erc_20.rs, not declared
    # here: a rust project's handlers are registered without the `tables:`
    # section, so a table declared in this file would never be written.

global:
  health_port: 8082
