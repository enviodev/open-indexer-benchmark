version: "3"

services:
  postgres:
    build:
      context: .
      dockerfile: ./docker/pg-Dockerfile
    ports:
      - 5432:5432
    volumes:
      # A named volume, not a bind mount into the project. Postgres writes as
      # its own user inside the container, so a bind-mounted `.data` comes back
      # owned by somebody the runner is not - and the driver clears `.data`
      # before every scenario, which then fails with EACCES and takes the rest
      # of the suite's scenarios with it. `docker compose down -v` disposes of
      # a named volume cleanly, which is what the harness does between runs.
      - subquery-reliability-pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Named subquery-node because that is the service the driver signals: the
  # process-kill and graceful-shutdown scenarios have to reach the node inside
  # its container rather than the foreground `compose up` that started it.
  subquery-node:
    image: subquerynetwork/subql-node-ethereum:latest
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    # The generated chain is served from the host, and this is the only indexer
    # that runs inside a container: without the mapping, the endpoint's host is
    # this container rather than the machine.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DB_USER: postgres
      DB_PASS: postgres
      DB_DATABASE: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      ETHEREUM_RPC_URL: ${ETHEREUM_RPC_URL}
    volumes:
      - ./:/app
    command:
      - ${SUB_COMMAND:-}
      - -f=/app
      - --db-schema=app
      - --workers=4
      - --batch-size=30
      # SubQuery runs mappings in a sandbox that only allows
      # ["assert","buffer","crypto","util","path"] to be imported. The token
      # metadata read in this case's handler goes through ethers, which reaches
      # for node's `http` when it makes the request, so without this the mapping
      # fails on every event with "Cannot find module 'http'" and the indexer
      # records nothing at all. This is SubQuery's own documented escape hatch
      # for projects that need more than the whitelist.
      - --unsafe
      # No dictionary. The generated chain answers as chain id 1, and the node
      # looks every chain id up in SubQuery's public dictionary registry, finds
      # the mainnet dictionary, and asks it which blocks carry this contract's
      # events. Mainnet has none at 0x...c0ffee, so the node skipped every
      # block, reported "Fully synced", and indexed nothing in any scenario -
      # a whole row of the table unmeasured, five minutes a run. The registry
      # is consulted even with --network-dictionary=false, so it is replaced
      # with an empty one instead: a registry naming no dictionary for any
      # chain.
      - '--dictionary-registry=data:application/json,{"ethereum":{}}'
    healthcheck:
      test:
        ["CMD", "wget", "--spider", "-q", "http://subquery-node:3000/ready"]
      interval: 3s
      timeout: 5s
      retries: 10

volumes:
  subquery-reliability-pgdata:
