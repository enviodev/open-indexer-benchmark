# Written to subgraph.yaml by the reliability driver before every run: the
# block range can only be expressed in the manifest, and most scenarios have no
# end block at all — they follow the head until the harness stops them.
specVersion: 1.3.0
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: MockToken
    # The mock chain answers as chain 1, so the ordinary mainnet configuration
    # applies unchanged.
    network: mainnet
    source:
      address: "0x5fbdb2315678afecb367f032d93f642f64180aa3"
      abi: MockToken
      startBlock: __START_BLOCK__
      # __END_BLOCK__
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - TransferEvent
        - TokenMetadata
      abis:
        - name: MockToken
          file: ./abis/MockToken.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleTransfer
        - event: MetadataUpdated(string,string)
          handler: handleMetadataUpdated
      file: ./src/mapping.ts
