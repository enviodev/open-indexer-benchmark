specVersion: 1.3.0
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: ERC20
    # The generated chain answers as mainnet: several tools treat an unknown
    # chain id as a configuration error rather than as a chain.
    network: mainnet
    source:
      address: "0x00000000000000000000000000000000000c0ffee"
      abi: ERC20
      # Both substituted by the driver before codegen reads this, because the
      # manifest is the only place a subgraph can express its block range.
      startBlock: __START_BLOCK__
      endBlock: __END_BLOCK__
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Account
        - Token
        - Transfer
      abis:
        - name: ERC20
          file: ./abis/ERC20.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleTransfer
      file: ./src/mapping.ts
