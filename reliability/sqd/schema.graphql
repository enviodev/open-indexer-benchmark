type Transfer @entity {
  id: ID!
  blockNumber: BigInt!
  "Near the top of an unsigned 32-bit integer in one scenario, so never an Int."
  logIndex: BigInt!
  from: String!
  to: String!
  amount: BigInt!
}

type Account @entity {
  id: ID!
  balance: BigInt!
}

type Token @entity {
  id: ID!
  symbol: String
  name: String
}

"One row per MetadataUpdated log: the second event the chain emits."
type MetadataUpdate @entity {
  id: ID!
  blockNumber: BigInt!
  logIndex: BigInt!
  symbol: String
  name: String
}
