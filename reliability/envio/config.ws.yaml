# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
#
# config.yaml with a WebSocket for new-block notifications, for the scenarios
# that time how soon a block becomes readable. The driver selects it through
# ENVIO_CONFIG when the harness offers a WebSocket. Everything else must stay
# identical to config.yaml - scripts/test-reliability.ts holds the two together.
name: reliability-indexer
description: The project the reliability scenarios index, over a generated chain
contracts:
  - name: ERC20
    events:
      - event: "Transfer(address indexed from, address indexed to, uint256 value)"
      # The second event. A project configured for one event cannot be asked
      # whether it would have indexed the other.
      - event: "MetadataUpdated(string symbol, string name)"
chains:
  # The generated chain answers as mainnet: several tools treat an unknown
  # chain id as a configuration error rather than as a chain.
  - id: 1
    start_block: 1000000
    end_block: ${ENVIO_END_BLOCK}
    rpc:
      url: ${ENVIO_RPC_URL}
      for: ${ENVIO_RPC_FOR:-sync}
      ws: ${ENVIO_RPC_WS}
    contracts:
      - name: ERC20
        # Quoted: YAML reads a bare 0x… as a hexadecimal integer, and a config
        # parser expecting a string then rejects the whole contract entry.
        address: "0x0000000000000000000000000000000000c0ffee"
