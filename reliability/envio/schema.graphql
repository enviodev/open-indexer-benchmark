type Transfer {
  id: ID!
  blockNumber: BigInt!
  "Near the top of an unsigned 32-bit integer in one scenario, so never an Int."
  logIndex: BigInt!
  from: String!
  to: String!
  amount: BigInt!
}

type Account {
  id: ID!
  balance: BigInt!
}

"""
One row per MetadataUpdated log - the second event the chain emits.

A tool configured for two events that indexes one of them passes every check
that reads transfers, which is most of them.
"""
type MetadataUpdate {
  id: ID!
  blockNumber: BigInt!
  logIndex: BigInt!
  symbol: String
  name: String
}

"Written from a contract read whose answers are deliberately awkward."
type Token {
  id: ID!
  symbol: String
  name: String
}
